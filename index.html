<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html dir='rtl' lang='ar' xmlns='http://www.w3.org/1999/xhtml'>
<head>
    <meta charset='UTF-8'/>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport'/>
    <title>حكايتنا - مشغل الفيديو</title>
    
    <style>
        /* إعدادات الشاشة الكاملة */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* يمنع السحب لضمان التركيز على الفيديو */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* حاوية الفيديو لتملأ الشاشة */
        .video-fullscreen {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* نسبة 16:9 */
            max-height: 100vh;
            max-width: 177.78vh; /* لمنع التمدد المشوه */
            background: #000;
            box-shadow: 0 0 50px rgba(229, 9, 20, 0.2);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* الطبقة الشفافة "المربحة" فوق الفيديو بالكامل */
        .click-trap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            cursor: pointer;
            background: rgba(0,0,0,0.01); /* خفية تماماً */
        }

        /* إعلان بانر صغير في الأسفل لزيادة الربح دون تشويه الشكل */
        .bottom-ad {
            position: fixed;
            bottom: 5px;
            z-index: 100;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .logo-overlay {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #e50914;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }
    </style>

    <!-- إعلانات Adsterra التلقائية (Popunder & Social Bar) -->
    <script type='text/javascript' src='//pl29305597.highperformanceformat.com/a5/e6/17/a5e6173b3b36cb3d30f4394d194eaa61.js'></script>
    <script src="https://pl29406212.profitablecpmratenetwork.com/db/ed/b1/dbedb1a74446e5fd07b4b596602cadb9.js"></script>
</head>
<body>

    <div class="logo-overlay">حكايتنا</div>

    <div class="video-fullscreen">
        <!-- طبقة النقر الإجباري: ستفتح الرابط المباشر عند أول لمسة للفيديو -->
        <div class="click-trap" id="trap" onclick="unlockVideo()"></div>
        
        <iframe id="player" 
            src="https://www.dailymotion.com/embed/video/xa8yj90?autoplay=0&ui-start-screen-info=false" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <!-- إعلان البانر السفلي -->
    <div class="bottom-ad">
        <script type="text/javascript">
            atOptions = {'key' : '96ffe7b5f8b8221bcb2e2d2d679a370e', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {}};
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/96ffe7b5f8b8221bcb2e2d2d679a370e/invoke.js"></script>
    </div>

    <script>
        function unlockVideo() {
            // 1. فتح الرابط المباشر (أعلى أرباحك)
            window.open('https://www.profitablecpmratenetwork.com/n5afwdtr78?key=21317cc52736e0f8228abe7f47a236ca', '_blank');
            
            // 2. إزالة الطبقة للسماح بالتشغيل
            document.getElementById('trap').style.display = 'none';
            
            // 3. محاولة تشغيل الفيديو تلقائياً بعد النقرة
            var vid = document.getElementById('player');
            vid.src += "&autoplay=1";
        }
    </script>

</body>
</html>
