<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا - جاري تجهيز الحلقة</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        .ad-space {
            background: #1a1a1a;
            border: 1px dashed #444;
            margin: 15px 0;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .timer-box {
            font-size: 20px;
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #e74c3c;
            border-radius: 10px;
        }
        #go-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* مخفي في البداية */
            width: 100%;
        }
        .status-text { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>حكايتنا - انتظر ثواني</h2>
    <p class="status-text">يتم الآن فحص الرابط وتجهيز المشغل...</p>

    <!-- مكان إعلان Monetag العلوي -->
    <div class="ad-space">
        <!-- ضع كود إعلان Monetag هنا -->
        <script async data-cfasync="false" src="//al5sm.com/tag.min.js?zone=10943622"></script>
    </div>

    <div class="timer-box" id="timer-container">
        انتظر <span id="seconds">15</span> ثانية...
    </div>

    <!-- زر الانتقال -->
    <button id="go-btn" onclick="goToEpisode()">اضغط هنا للمشاهدة الآن</button>

    <!-- مكان إعلان Native أو بانر إضافي -->
    <div class="ad-space">
        <p style="color:#444">إعلان مروج</p>
    </div>
</div>

<script>
    // 1. نظام العداد
    let timeLeft = 15;
    const timerElement = document.getElementById('seconds');
    const timerContainer = document.getElementById('timer-container');
    const goButton = document.getElementById('go-btn');

    const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerContainer.style.display = 'none';
            goButton.style.display = 'block';
        }
    }, 1000);

    // 2. وظيفة التوجه للمسلسل
    function goToEpisode() {
        // استبدل هذا الرابط برابط المسلسل الفعلي أو اجعله ديناميكي
        window.location.href = "https://www.hikaytna.my/";
    }

    // 3. كود الإعلان المنبثق (الذي طلبته) - يعمل مرة واحدة فقط
    (function() {
        document.addEventListener('click', function fire() {
            var s = document.createElement('script');
            s.src = 'https://al5sm.com/tag.min.js';
            s.dataset.zone = '10943622';
            document.head.appendChild(s);
            document.removeEventListener('click', fire);
        }, {once: true});
    })();
</script>

</body>
</html>
