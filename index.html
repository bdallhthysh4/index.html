<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا - جاري تجهيز الحلقة</title>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 400px; margin: auto; }
        
        /* تصميم البانر الصوري */
        .ad-image-slot { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            margin: 15px 0; 
            min-height: 250px; 
            border-radius: 12px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            text-decoration: none;
            position: relative;
        }
        .ad-image-slot img { width: 100%; height: auto; display: block; }
        .ad-tag { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.5); font-size: 9px; padding: 2px 5px; color: #666; }

        .timer-box { font-size: 18px; margin: 20px; color: #ff4d4d; border: 1px solid #333; padding: 15px; border-radius: 10px; background: #111; }
        .btn { 
            background: #e74c3c; color: white; border: none; padding: 18px; 
            width: 100%; font-size: 20px; font-weight: bold; border-radius: 10px; 
            display: none; cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-bottom:0;">حكايتنا</h2>
    <p style="color:#666; font-size:12px; margin-top:5px;">سيظهر رابط المشاهدة بعد قليل...</p>
    
    <a href="https://nap5k.com/tag.min.js?zone=10995706" target="_blank" class="ad-image-slot">
        <span class="ad-tag">إعلان</span>
        <img src="https://placehold.co/300x250/1a1a1a/e74c3c?text=اضغط+هنا+للمشاهدة+الآن" alt="Ad">
    </a>

    <div id="timer" class="timer-box">
        جاري تجهيز المشغل: <span id="sec">15</span> ثانية
    </div>

    <button id="btn" class="btn" onclick="location.href='https://www.hikaytna.my/'">✓ الانتقال للمشغل الآن</button>

    <a href="https://nap5k.com/tag.min.js?zone=10995706" target="_blank" class="ad-image-slot">
        <span class="ad-tag">إعلان</span>
        <img src="https://placehold.co/300x250/1a1a1a/e74c3c?text=مشاهدة+بجودة+عالية" alt="Ad">
    </a>
</div>

<script>
    // 1. نظام العداد
    let s = 15;
    let timer = setInterval(() => {
        s--;
        document.getElementById('sec').innerText = s;
        if (s <= 0) {
            clearInterval(timer);
            document.getElementById('timer').style.display = 'none';
            document.getElementById('btn').style.display = 'block';
        }
    }, 1000);

    // 2. سكريبت البوب أندر (الإعلان المنبثق) - يعمل مرة واحدة كل 5 دقائق
    (function() {
        const COOLDOWN = 5 * 60 * 1000;
        document.addEventListener('click', function fire() {
            const lastAd = localStorage.getItem('ad_p_10995706');
            if (!lastAd || (Date.now() - lastAd > COOLDOWN)) {
                var script = document.createElement('script');
                script.src = 'https://nap5k.com/tag.min.js';
                script.dataset.zone = '10995706';
                document.head.appendChild(script);
                localStorage.setItem('ad_p_10995706', Date.now());
                document.removeEventListener('click', fire);
            }
        });
    })();
</script>

</body>
</html>
