<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا - جاري التجهيز</title>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .ad-box { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            margin: 20px 0; 
            min-height: 250px; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
        }
        .timer { font-size: 18px; margin: 20px; color: #e74c3c; border: 1px solid #e74c3c; padding: 15px; border-radius: 5px; background: rgba(231, 76, 60, 0.1); }
        .btn { 
            background: #e74c3c; color: white; border: none; padding: 18px; 
            width: 100%; font-size: 20px; font-weight: bold; border-radius: 8px; display: none; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        .ad-label { font-size: 11px; color: #666; margin-bottom: 8px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-bottom: 5px;">حكايتنا</h2>
    <p style="color: #888; font-size: 13px;">جاري تجهيز سيرفرات المشاهدة...</p>
    
    <div class="ad-box">
        <span class="ad-label">إعلان مروج</span>
        <script async data-cfasync="false" src="//al5sm.com/tag.min.js?zone=10943622"></script>
        <div id="container-10943622"></div>
    </div>

    <div id="timer" class="timer">انتظر <span id="sec">15</span> ثانية لظهور زر المشاهدة</div>
    <button id="btn" class="btn" onclick="location.href='https://www.hikaytna.my/'">اضغط هنا للمشاهدة الآن</button>

    <div class="ad-box">
        <span class="ad-label">إعلان مروج</span>
        <script async data-cfasync="false" src="//al5sm.com/tag.min.js?zone=10943622"></script>
    </div>
</div>

<script>
    // العداد
    let s = 15;
    let timer = setInterval(() => {
        s--;
        document.getElementById('sec').innerText = s;
        if (s <= 0) {
            clearInterval(timer);
            document.getElementById('timer').style.display = 'none';
            document.getElementById('btn').style.display = 'block';
        }
    }, 1000);

    // سكريبت الإعلان المنبثق عند أول لمسة (Pop-under)
    document.addEventListener('click', function fire() {
        var script = document.createElement('script');
        script.src = 'https://al5sm.com/tag.min.js';
        script.dataset.zone = '10943622';
        document.head.appendChild(script);
        document.removeEventListener('click', fire);
    }, {once: true});
</script>

</body>
</html>
