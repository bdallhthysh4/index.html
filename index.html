<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1"/>
    <title>Shadwo PRO - روابط MP4 المباشرة فقط</title>
    <style>
        :root {
            --bg: #0a0a0f; --card: #111118; --border: #222230;
            --green: #00e676; --red: #ff3d3d; --orange: #ff9100; --text: #c8c8d0; --gold: #ffd700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text); min-height: 100vh; padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 18px; }
        header h1 { font-size: 1.6em; color: var(--green); }
        header p { color: #666; font-size: 0.8em; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
        .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .input-row input {
            flex: 1; min-width: 200px; padding: 13px;
            background: #0b0b14; border: 2px solid #2a2a38; border-radius: 10px;
            color: #fff; font-family: 'Consolas', monospace; font-size: 0.85em;
        }
        .input-row input:focus { outline: none; border-color: var(--green); }
        .btn {
            padding: 13px 22px; border: none; border-radius: 10px;
            font-weight: 700; font-size: 0.9em; cursor: pointer; transition: all 0.25s; white-space: nowrap;
        }
        .btn-go { background: var(--green); color: #000; }
        .btn-go:hover { background: #00ff84; }
        .btn-go:disabled { background: #2a2a38; color: #555; cursor: not-allowed; }

        .status-bar {
            display: none; align-items: center; gap: 10px;
            padding: 12px 16px; margin: 10px 0;
            background: #111118; border-radius: 10px; border: 1px solid var(--border);
        }
        .status-bar.active { display: flex; }
        .spinner {
            width: 20px; height: 20px; border: 2px solid #2a2a38;
            border-top: 2px solid var(--green); border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { font-size: 0.82em; color: #888; }
        .status-text b { color: var(--green); }

        .counter-badge {
            background: var(--green); color: #000; padding: 3px 10px;
            border-radius: 12px; font-weight: 800; font-size: 0.75em; margin-right: 12px;
        }

        .results-area { margin-top: 12px; }
        .result-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 8px;
            transition: all 0.2s;
        }
        .result-item.best {
            border-color: var(--green); box-shadow: 0 0 25px rgba(0,230,118,0.2);
            background: #0a1a11;
        }
        .result-top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
        }
        .tag {
            padding: 6px 14px; border-radius: 16px; font-weight: 800; font-size: 0.7em;
        }
        .tag-alive { background: #00e67622; color: var(--green); border: 1px solid #00e67644; }
        .tag-maybe { background: #ff910022; color: var(--orange); border: 1px solid #ff910044; }
        .tag-best { background: #ffd70022; color: var(--gold); border: 1px solid #ffd70044; }
        .link-box {
            background: #050510; border: 1px solid #1a1a2a; border-radius: 8px;
            padding: 12px; font-family: 'Consolas', monospace; font-size: 0.7em;
            color: #0f0; word-break: break-all; margin-bottom: 8px;
            user-select: all; max-height: 50px; overflow-y: auto;
            direction: ltr; text-align: left;
        }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-sm {
            padding: 9px 14px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 0.75em; cursor: pointer; transition: all 0.2s;
            text-decoration: none; display: inline-block;
        }
        .btn-copy { background: #2a2a38; color: #ccc; }
        .btn-copy:hover { background: #3a3a48; }
        .btn-open { background: var(--green); color: #000; }
        .btn-open:hover { background: #00ff84; }
        .btn-dl { background: #ff6600; color: #fff; }
        .btn-dl:hover { background: #ff7722; }

        .empty-state { text-align: center; padding: 30px; color: #555; }
        .success-banner {
            background: #0a1a11; border: 1px solid #00e67644;
            border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 10px;
            color: var(--green); font-weight: 700; font-size: 0.85em;
        }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #00e676; color: #000; padding: 10px 20px;
            border-radius: 25px; font-weight: 700; font-size: 0.85em;
            z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        .log-panel {
            background: #0a0a10; border: 1px solid #1a1a2a; border-radius: 8px;
            padding: 10px; font-family: 'Consolas', monospace; font-size: 0.68em;
            color: #0f0; max-height: 120px; overflow-y: auto; white-space: pre-wrap;
            word-break: break-all; margin-top: 8px; display: none;
        }
        .log-panel.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 روابط MP4 المباشرة من Shadwo</h1>
            <p>يعرض فقط روابط <code style="color:#0f0;">aflm-eco2-akf.cdnz.quest/.../v.mp4</code> الشغالة</p>
        </header>

        <div class="card">
            <div class="input-row">
                <input type="text" id="urlInput"
                       value="https://w.shadwo.pro/albaplayer/esref-ruya-s01e01/"
                       placeholder="ضع رابط Shadwo هنا...">
                <button class="btn btn-go" id="goBtn" onclick="startExtract()">🔍 استخراج الروابط المباشرة</button>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">جاري العمل...</div>
        </div>

        <div class="results-area" id="resultsArea">
            <div class="empty-state">اضغط على الزر لاستخراج الروابط المباشرة</div>
        </div>

        <div class="log-panel" id="logPanel"></div>
    </div>

    <div class="toast" id="toast">✅ تم النسخ!</div>

    <script>
        const PROXIES = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://api.codetabs.com/v1/proxy?quest=",
        ];

        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const resultsArea = document.getElementById('resultsArea');
        const logPanel = document.getElementById('logPanel');
        const toast = document.getElementById('toast');

        let foundMp4Urls = [];
        let log = '';

        function addLog(msg) {
            log += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logPanel.value = log;
            logPanel.classList.add('active');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function setStatus(msg) { statusText.innerHTML = msg; }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✅ تم!';
                btn.style.background = '#00e676';
                btn.style.color = '#000';
                setTimeout(() => { btn.textContent = orig; btn.style.background = '#2a2a38'; btn.style.color = '#ccc'; }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed'; ta.style.left = '-9999px';
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ تم النسخ!');
            });
        }

        async function fetchPage(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 10000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept': '*/*' },
                        signal: ctrl.signal
                    });
                    clearTimeout(t);
                    if (res.ok) return await res.text();
                } catch(e) { continue; }
            }
            throw new Error('فشل الاتصال');
        }

        function extractIframes(html) {
            const r = /<iframe[^>]+src=["']([^"']+)["']/gi;
            const out = [];
            let m;
            while ((m = r.exec(html))) out.push(m[1]);
            return [...new Set(out)];
        }

        function extractVideoId(url) {
            let m = url.match(/embed-([a-z0-9]+)\.html/i);
            if (m) return m[1];
            m = url.match(/[?&]id=([a-z0-9]+)/i);
            if (m) return m[1];
            m = url.match(/mp4plus\.\w+\/([a-z0-9]+)\.html/i);
            if (m) return m[1];
            return null;
        }

        // ============ استخراج روابط aflm حصراً ============
        function extractAflmUrls(html) {
            const found = [];
            const patterns = [
                /https?:\/\/aflm-eco2-akf\.cdnz\.quest\/[a-z0-9]+\/v\.mp4/gi,
                /https?:\/\/aflm[^\s"'<>]*cdnz\.quest[^\s"'<>]*\.mp4/gi,
            ];
            for (const p of patterns) {
                let m;
                while ((m = p.exec(html))) {
                    let u = m[0].replace(/["'<>\\]+$/, '').replace(/&amp;/g, '&');
                    if (!found.includes(u)) found.push(u);
                }
            }
            return found;
        }

        async function checkUrl(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 7000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        method: 'GET',
                        headers: { 'User-Agent': 'Mozilla/5.0', 'Range': 'bytes=0-511' },
                        signal: ctrl.signal
                    });
                    clearTimeout(t);
                    if (res.ok || res.status === 206) return true;
                    if (res.status === 403) return 'maybe';
                } catch(e) { continue; }
            }
            return false;
        }

        function addResult(url, source, status) {
            // ===== تجاهل الروابط الميتة تماماً =====
            if (status === false) return;
            
            if (foundMp4Urls.find(u => u.url === url)) return;
            foundMp4Urls.push({ url, source, status, time: new Date().toLocaleTimeString() });
            renderResults();
        }

        function renderResults() {
            // ===== تصفية: عرض فقط الشغالة والمحتملة =====
            const validUrls = foundMp4Urls.filter(u => u.status === true || u.status === 'maybe');
            
            if (validUrls.length === 0) {
                resultsArea.innerHTML = '<div class="empty-state">🔍 لم يتم العثور على روابط صالحة بعد...</div>';
                return;
            }

            const sorted = [...validUrls].sort((a, b) => {
                if (a.status === true && b.status !== true) return -1;
                if (a.status !== true && b.status === true) return 1;
                return 0;
            });

            let html = '';
            if (validUrls.length > 0) {
                html += `<div class="success-banner">✅ تم العثور على <span class="counter-badge">${validUrls.length}</span> رابط MP4 مباشر</div>`;
            }

            for (const item of sorted) {
                const isAlive = item.status === true;
                const isBest = isAlive;
                const escaped = item.url.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                html += `
                <div class="result-item${isBest ? ' best' : ''}">
                    <div class="result-top">
                        <span class="tag ${isBest ? 'tag-best' : 'tag-maybe'}">
                            ${isBest ? '⭐ MP4 مباشر' : '⚠️ رابط مباشر'}
                        </span>
                        <span style="color:#666;font-size:0.7em;">${item.source} | ${item.time}</span>
                    </div>
                    <div class="link-box">${item.url}</div>
                    <div class="actions">
                        <button class="btn-sm btn-copy" onclick="copyText('${escaped}', this)">📋 نسخ</button>
                        <a class="btn-sm btn-open" href="${item.url}" target="_blank" rel="noopener">▶️ فتح</a>
                        <a class="btn-sm btn-dl" href="${item.url}" download>⬇️ تحميل</a>
                    </div>
                </div>`;
            }
            resultsArea.innerHTML = html;
        }

        // ============ CORE ============
        async function startExtract() {
            const inputUrl = urlInput.value.trim();
            if (!inputUrl) return;

            foundMp4Urls = [];
            log = '';
            resultsArea.innerHTML = '<div class="empty-state">⏳ جاري البحث عن الروابط المباشرة...</div>';
            logPanel.classList.add('active');
            statusBar.classList.add('active');
            goBtn.disabled = true;
            setStatus('جاري <b>البحث عن روابط MP4</b>...');

            addLog('🎯 بدء استخراج روابط aflm MP4 المباشرة');
            addLog(`📄 ${inputUrl}`);

            const baseUrl = inputUrl.includes('serv=') ? inputUrl :
                           inputUrl + (inputUrl.includes('?') ? '&' : '?') + 'serv=0';

            const allAflmUrls = [];
            const processedIframes = new Set();

            // التركيز على MP4Plus أولاً
            const servers = [
                { id: 2, name: 'MP4Plus ⭐' },
                { id: 1, name: 'CDNPlus' },
                { id: 3, name: 'AnaFast' },
                { id: 4, name: 'Vidoba' },
            ];

            for (const srv of servers) {
                const servUrl = baseUrl.replace(/serv=\d+/g, 'serv=' + srv.id);
                setStatus(`جاري فحص <b>${srv.name}</b>...`);
                addLog(`🔍 ${srv.name}`);

                try {
                    const servHtml = await fetchPage(servUrl);
                    const directAflm = extractAflmUrls(servHtml);
                    directAflm.forEach(u => allAflmUrls.push({ url: u, source: srv.name }));
                    if (directAflm.length) addLog(`  ✅ ${directAflm.length} رابط مباشر`);

                    const iframes = extractIframes(servHtml);
                    for (const iframeUrl of iframes) {
                        if (processedIframes.has(iframeUrl)) continue;
                        processedIframes.add(iframeUrl);

                        setStatus(`جاري فحص iframe <b>${srv.name}</b>...`);
                        try {
                            const iframeHtml = await fetchPage(iframeUrl);
                            const aflmUrls = extractAflmUrls(iframeHtml);
                            aflmUrls.forEach(u => allAflmUrls.push({ url: u, source: srv.name + ' iframe' }));
                            if (aflmUrls.length) addLog(`  🎯 ${aflmUrls.length} رابط aflm`);

                            // iframe متداخل
                            const nested = extractIframes(iframeHtml);
                            for (const nUrl of nested) {
                                if (processedIframes.has(nUrl)) continue;
                                processedIframes.add(nUrl);
                                try {
                                    const nHtml = await fetchPage(nUrl);
                                    const nAflm = extractAflmUrls(nHtml);
                                    nAflm.forEach(u => allAflmUrls.push({ url: u, source: srv.name + ' nested' }));
                                    if (nAflm.length) addLog(`  🎯 ${nAflm.length} رابط aflm متداخل`);
                                } catch(e) {}
                            }

                            // بناء من video ID إذا ما لقينا
                            if (aflmUrls.length === 0) {
                                const vidId = extractVideoId(iframeUrl);
                                if (vidId) {
                                    addLog(`  🏗️ بناء من ID: ${vidId}`);
                                    [
                                        `https://aflm-eco2-akf.cdnz.quest/${vidId}/v.mp4`,
                                        `https://aflm-eco2-akf.cdnz.quest/${vidId}_l/v.mp4`,
                                    ].forEach(u => allAflmUrls.push({ url: u, source: srv.name + ' built' }));
                                }
                            }
                        } catch(e) {}
                    }
                } catch(e) { addLog(`  ❌ ${e.message}`); }
            }

            // إزالة التكرار
            const uniqueUrls = [];
            const seen = new Set();
            for (const item of allAflmUrls) {
                if (!seen.has(item.url) && item.url.length > 30 && item.url.includes('aflm')) {
                    seen.add(item.url);
                    uniqueUrls.push(item);
                }
            }

            addLog(`\n📦 ${uniqueUrls.length} رابط aflm فريد`);

            // فحص الروابط
            if (uniqueUrls.length > 0) {
                setStatus(`جاري <b>فحص ${uniqueUrls.length} رابط</b>...`);
                addLog('🔍 فحص الروابط...');
                
                let aliveCount = 0;
                for (const item of uniqueUrls) {
                    const status = await checkUrl(item.url);
                    if (status === true) {
                        aliveCount++;
                        addLog(`  ✅ ${item.url.substring(0, 55)}...`);
                    } else if (status === 'maybe') {
                        aliveCount++;
                        addLog(`  ⚠️ ${item.url.substring(0, 55)}...`);
                    } else {
                        addLog(`  ❌ تجاهل: ${item.url.substring(0, 50)}...`);
                    }
                    addResult(item.url, item.source, status);
                }
                addLog(`\n✅ ${aliveCount} رابط صالح للاستخدام`);
            } else {
                addLog('\n⚠️ لا توجد روابط aflm');
                resultsArea.innerHTML = '<div class="empty-state">❌ لم يتم العثور على روابط. جرب فتح الرابط في المتصفح واستخدام F12</div>';
            }

            setStatus('<b>✅ انتهى</b>');
            statusBar.classList.remove('active');
            goBtn.disabled = false;
        }

        urlInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') startExtract();
        });

        console.log('✅ مستخرج روابط aflm MP4 - يعرض الصالحة فقط.');
    </script>
</body>
</html>
