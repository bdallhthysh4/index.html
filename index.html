<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html dir='rtl' lang='ar' xmlns='http://www.w3.org/1999/xhtml'>
<head>
    <meta charset='UTF-8'/>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport'/>
    <title>المشغل الذكي - أرباح مضاعفة</title>
    
    <!-- 1. تعريف تطبيق AdMob الخاص بك لجوجل -->
    <script async="async" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5985288941774654" crossorigin="anonymous"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .full-screen-container { position: relative; width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* طبقة الربح المباشر من Adsterra */
        .ad-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; cursor: pointer; background: rgba(0,0,0,0.01); }

        /* حاوية إعلان البانر (AdMob) في الأسفل */
        .admob-banner {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 100%; text-align: center; background: rgba(0,0,0,0.5);
        }
    </style>

    <!-- إعلانات Adsterra التلقائية (Popunder & Social Bar) -->
    <script type='text/javascript' src='//pl29305597.highperformanceformat.com/a5/e6/17/a5e6173b3b36cb3d30f4394d194eaa61.js'></script>
</head>
<body>

    <div class="full-screen-container">
        <!-- طبقة النقر لفتح الرابط المباشر من Adsterra -->
        <div class="ad-layer" id="earnLayer" onclick="triggerAds()"></div>
        
        <!-- مشغل الفيديو الخاص بك -->
        <iframe id="video" 
            src="https://www.dailymotion.com/embed/video/xa8yj90?autoplay=0&ui-logo=false" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <!-- 2. وحدة إعلان البانر من AdMob (التي أنشأتها للتو) -->
    <div class="admob-banner">
        <ins class="adsbygoogle"
             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-pub-5985288941774654"
             data-ad-slot="4891819896"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        function triggerAds() {
            // فتح الرابط المباشر (Adsterra Direct Link)
            window.open('https://www.profitablecpmratenetwork.com/n5afwdtr78?key=21317cc52736e0f8228abe7f47a236ca', '_blank');
            
            // إزالة الطبقة لتمكين الفيديو
            document.getElementById('earnLayer').style.display = 'none';
            
            // تشغيل الفيديو تلقائياً
            var player = document.getElementById('video');
            player.src += "&autoplay=1";
        }
    </script>

</body>
</html>
