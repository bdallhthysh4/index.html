<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج الروابط المباشرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #111;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,255,136,0.08);
            border: 1px solid #222;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 1.8em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 0.9em;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 250px;
            padding: 14px 18px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0,255,136,0.15);
        }
        button {
            padding: 14px 28px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            white-space: nowrap;
        }
        button:hover {
            background: #00cc6a;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0,255,136,0.3);
        }
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .loader.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .results {
            margin-top: 20px;
        }
        .server-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.2s;
        }
        .server-card:hover {
            border-color: #00ff8855;
            background: #1c1c1c;
        }
        .server-name {
            font-weight: bold;
            color: #00ff88;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .server-name .icon {
            font-size: 1.3em;
        }
        .link-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-copy {
            background: #2a2a2a;
            color: #fff;
        }
        .btn-copy:hover {
            background: #3a3a3a;
        }
        .btn-open {
            background: #00ff88;
            color: #000;
        }
        .btn-open:hover {
            background: #00cc6a;
        }
        .btn-download {
            background: #ff6600;
            color: #fff;
        }
        .btn-download:hover {
            background: #e55d00;
        }
        .no-results {
            text-align: center;
            padding: 30px;
            color: #ff4444;
            background: #1a0000;
            border-radius: 10px;
            border: 1px solid #330000;
        }
        .hidden {
            display: none;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #0f0;
            font-family: monospace;
            padding: 15px;
            margin-top: 15px;
            resize: vertical;
            font-size: 0.85em;
        }
        .raw-section {
            margin-top: 20px;
        }
        .raw-section summary {
            cursor: pointer;
            color: #888;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 مستخرج الروابط المباشرة</h1>
        <p class="subtitle">أدخل رابط لاعب Shadwo PRO لاستخراج جميع روابط المشاهدة والتحميل</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://w.shadwo.pro/albaplayer/.../?serv=0" value="https://w.shadwo.pro/albaplayer/doktor-baska-hayatta-2026-s01e06/?serv=0">
            <button id="extractBtn" onclick="extractLinks()">🔍 استخراج الروابط</button>
        </div>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>جاري استخراج الروابط...</p>
        </div>
        
        <div class="results" id="results"></div>
        
        <details class="raw-section" id="rawSection" style="display:none;">
            <summary>📄 عرض البيانات الخام (Raw Response)</summary>
            <textarea id="rawData" readonly></textarea>
        </details>
    </div>

    <script>
        const DEFAULT_URL = "https://w.shadwo.pro/albaplayer/doktor-baska-hayatta-2026-s01e06/?serv=0";
        
        // السيرفرات المعروفة
        const SERVER_PATTERNS = [
            { name: "CDNPlus", pattern: /cdnplus|cdn\+/i, icon: "⚡" },
            { name: "MP4Plus", pattern: /mp4plus|mp4\+/i, icon: "🎥" },
            { name: "AnaFast", pattern: /anafast|ana-fast/i, icon: "🚀" },
            { name: "Vidoba", pattern: /vidoba/i, icon: "📺" },
            { name: "VidSpeed", pattern: /vidspeed|vid-speed/i, icon: "💨" },
            { name: "Larhu", pattern: /larhu/i, icon: "🔴" },
            { name: "VK", pattern: /vk\.com|vk\.ru|vkontakte|userapi/i, icon: "🔵" },
            { name: "OK", pattern: /ok\.ru|odnoklassniki/i, icon: "🟠" }
        ];

        function getServerInfo(url) {
            for (let server of SERVER_PATTERNS) {
                if (server.pattern.test(url)) {
                    return server;
                }
            }
            // محاولة تخمين من الدومين
            try {
                const domain = new URL(url).hostname.replace("www.", "").split(".")[0];
                return { name: domain.charAt(0).toUpperCase() + domain.slice(1), pattern: null, icon: "🔗" };
            } catch(e) {
                return { name: "خادم غير معروف", pattern: null, icon: "❓" };
            }
        }

        function extractIframeSrc(html) {
            const iframeRegex = /<iframe[^>]+src=["']([^"']+)["']/gi;
            const matches = [];
            let match;
            while ((match = iframeRegex.exec(html)) !== null) {
                matches.push(match[1]);
            }
            return matches;
        }

        function extractAllUrls(html) {
            const urlRegex = /https?:\/\/[^\s"'<>]+/gi;
            const matches = [];
            let match;
            while ((match = urlRegex.exec(html)) !== null) {
                let url = match[0].replace(/["'<>]$/, '').replace(/\\/g, '');
                if (url.includes('google') || url.includes('facebook') || url.includes('twitter')) continue;
                if (url.endsWith('.js') || url.endsWith('.css') || url.endsWith('.png') || url.endsWith('.jpg')) continue;
                matches.push(url);
            }
            return [...new Set(matches)];
        }

        function findVideoUrls(urls) {
            const videoExtensions = ['.mp4', '.m3u8', '.ts', '.mkv', '.webm', '.flv', '.avi', '.mov', '.wmv'];
            const streamingKeywords = ['stream', 'video', 'play', 'vod', 'hls', 'dash', 'manifest', 'm3u8', 'mp4', 'token'];
            
            return urls.filter(url => {
                const lower = url.toLowerCase();
                if (videoExtensions.some(ext => lower.includes(ext))) return true;
                if (streamingKeywords.some(kw => lower.includes(kw))) return true;
                return false;
            });
        }

        async function extractLinks(url) {
            const inputUrl = url || document.getElementById('urlInput').value.trim() || DEFAULT_URL;
            document.getElementById('urlInput').value = inputUrl;
            
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');
            const rawSection = document.getElementById('rawSection');
            const rawData = document.getElementById('rawData');
            const btn = document.getElementById('extractBtn');
            
            loader.classList.add('active');
            resultsDiv.innerHTML = '';
            rawSection.style.display = 'none';
            btn.disabled = true;
            
            try {
                const corsProxy = "https://api.allorigins.win/raw?url=";
                const targetUrl = encodeURIComponent(inputUrl);
                
                const response = await fetch(corsProxy + targetUrl, {
                    method: 'GET',
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const html = await response.text();
                rawData.value = html;
                rawSection.style.display = 'block';
                
                let allUrls = [];
                
                // استخراج من iframes
                const iframeUrls = extractIframeSrc(html);
                allUrls = [...allUrls, ...iframeUrls];
                
                // استخراج كل الروابط
                const pageUrls = extractAllUrls(html);
                allUrls = [...allUrls, ...pageUrls];
                
                // إزالة التكرارات
                allUrls = [...new Set(allUrls)];
                
                // تصفية روابط الفيديو المحتملة
                const videoUrls = findVideoUrls(allUrls);
                const otherUrls = allUrls.filter(u => !videoUrls.includes(u));
                
                // دمج مع إعطاء أولوية لروابط الفيديو
                const priorityUrls = [...videoUrls, ...otherUrls];
                
                // إذا لم نجد روابط مباشرة، نحاول استخراج من الإطارات المضمنة
                if (priorityUrls.length === 0 && iframeUrls.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="no-results" style="background:#1a1a00;border-color:#333300;color:#ffaa00;">
                            <p>⚠️ تم العثور على ${iframeUrls.length} إطار مضمن. جاري فتحها لاستخراج الروابط...</p>
                        </div>`;
                    
                    for (let iframeUrl of iframeUrls) {
                        try {
                            const iframeResponse = await fetch(corsProxy + encodeURIComponent(iframeUrl));
                            const iframeHtml = await iframeResponse.text();
                            const nestedUrls = extractAllUrls(iframeHtml);
                            allUrls = [...allUrls, ...nestedUrls];
                        } catch(e) {
                            console.log("خطأ في استخراج الإطار:", iframeUrl, e);
                        }
                    }
                    allUrls = [...new Set(allUrls)];
                }
                
                // عرض النتائج
                if (allUrls.length === 0) {
                    resultsDiv.innerHTML = '<div class="no-results">❌ لم يتم العثور على روابط. قد يكون الموقع محمياً أو يتطلب تحميل ديناميكي.</div>';
                } else {
                    let htmlOutput = '';
                    let count = 0;
                    
                    for (let link of allUrls) {
                        if (link.includes('google') || link.includes('facebook') || link.includes('twitter') || 
                            link.includes('schema.org') || link.includes('w3.org') || link.includes('youtube.com')) continue;
                        
                        count++;
                        const server = getServerInfo(link);
                        
                        htmlOutput += `
                            <div class="server-card">
                                <div class="server-name">
                                    <span class="icon">${server.icon}</span>
                                    ${server.name}
                                </div>
                                <div class="link-actions">
                                    <button class="btn-sm btn-copy" onclick="copyToClipboard('${link.replace(/'/g, "\\'")}', this)">📋 نسخ</button>
                                    <a class="btn-sm btn-open" href="${link}" target="_blank">▶️ فتح</a>
                                    <a class="btn-sm btn-download" href="${link}" download>⬇️ تحميل</a>
                                </div>
                            </div>`;
                    }
                    
                    if (count === 0) {
                        htmlOutput = '<div class="no-results">❌ لا توجد روابط صالحة بعد التصفية.</div>';
                    }
                    
                    resultsDiv.innerHTML = htmlOutput || '<div class="no-results">❌ لم يتم العثور على روابط.</div>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="no-results">❌ فشل الاتصال: ${error.message}<br><br>جرب استخدام رابط مختلف أو تاكد من أن الموقع متاح.</div>`;
                console.error("Extraction error:", error);
            } finally {
                loader.classList.remove('active');
                btn.disabled = false;
            }
        }
        
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✅ تم النسخ!';
                btn.style.background = '#00cc6a';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#2a2a2a';
                }, 1500);
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✅ تم!';
                setTimeout(() => { btn.textContent = '📋 نسخ'; }, 1500);
            });
        }
        
        // دعم زر Enter
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') extractLinks();
        });
        
        // تشغيل تلقائي عند التحميل
        window.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('urlInput');
            if (input.value && input.value.includes('shadwo.pro')) {
                extractLinks();
            }
        });
    </script>
</body>
</html>
