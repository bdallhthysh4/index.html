<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1"/>
    <title>Shadwo PRO - مستخرج M3U8 (الروابط الشغالة فقط)</title>
    <style>
        :root {
            --bg: #0a0a0f; --card: #111118; --border: #222230;
            --green: #00e676; --red: #ff3d3d; --orange: #ff9100; --text: #c8c8d0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text); min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.7em; color: var(--green); text-shadow: 0 0 20px rgba(0,230,118,0.15); }
        header p { color: #666; font-size: 0.82em; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
        .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .input-row input {
            flex: 1; min-width: 220px; padding: 14px;
            background: #0b0b14; border: 2px solid #2a2a38; border-radius: 10px;
            color: #fff; font-family: 'Consolas', monospace; font-size: 0.88em;
        }
        .input-row input:focus { outline: none; border-color: var(--green); }
        .btn {
            padding: 14px 24px; border: none; border-radius: 10px;
            font-weight: 700; font-size: 0.95em; cursor: pointer; transition: all 0.25s; white-space: nowrap;
        }
        .btn-go { background: var(--green); color: #000; }
        .btn-go:hover { background: #00ff84; box-shadow: 0 6px 28px rgba(0,230,118,0.35); }
        .btn-go:disabled { background: #2a2a38; color: #555; cursor: not-allowed; }
        .btn-verify { background: var(--orange); color: #000; }
        .btn-verify:hover { background: #ffaa00; }

        .progress-box {
            display: none; background: #111118; border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin: 14px 0;
        }
        .progress-box.active { display: block; }
        .progress-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid #1a1a25; font-size: 0.82em;
        }
        .progress-item:last-child { border-bottom: none; }
        .prog-icon { width: 22px; text-align: center; }
        .prog-name { flex: 1; color: #aaa; }
        .prog-status { color: #555; font-size: 0.85em; min-width: 100px; text-align: left; }
        .prog-status.done { color: var(--green); }
        .prog-status.running { color: var(--orange); animation: pulse 1.2s infinite; }
        .prog-status.fail { color: var(--red); }
        .prog-status.skip { color: #555; text-decoration: line-through; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .stats-bar {
            display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0;
        }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px 20px; text-align: center; flex: 1; min-width: 100px;
        }
        .stat-num { font-size: 2em; font-weight: 800; }
        .stat-num.green { color: var(--green); }
        .stat-num.red { color: var(--red); }
        .stat-num.orange { color: var(--orange); }
        .stat-label { font-size: 0.7em; color: #666; margin-top: 4px; }

        .results-area { margin-top: 16px; }
        .result-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 18px; margin-bottom: 10px; transition: all 0.2s;
        }
        .result-item.best {
            border-color: var(--green); box-shadow: 0 0 30px rgba(0,230,118,0.2);
            background: #0a1a11;
        }
        .result-item.dead {
            opacity: 0.4; border-color: #333;
        }
        .result-top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
        }
        .tag {
            padding: 6px 14px; border-radius: 16px; font-weight: 800; font-size: 0.7em;
        }
        .tag-live { background: #00e67622; color: var(--green); border: 1px solid #00e67644; }
        .tag-dead { background: #ff3d3d22; color: var(--red); border: 1px solid #ff3d3d44; }
        .tag-best { background: #ffd70022; color: #ffd700; border: 1px solid #ffd70044; }
        .tag-checking { background: #ff910022; color: var(--orange); border: 1px solid #ff910044; animation: pulse 1s infinite; }
        .tag-m3u8 { background: #4488ff22; color: #4488ff; border: 1px solid #4488ff44; }
        .link-box {
            background: #050510; border: 1px solid #1a1a2a; border-radius: 8px;
            padding: 14px; font-family: 'Consolas', monospace; font-size: 0.7em;
            color: #0f0; word-break: break-all; margin-bottom: 10px;
            user-select: all; max-height: 60px; overflow-y: auto; line-height: 1.6;
            direction: ltr; text-align: left;
        }
        .link-box.dead-link { color: #ff4444; text-decoration: line-through; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-sm {
            padding: 10px 16px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 0.78em; cursor: pointer; transition: all 0.2s;
            text-decoration: none; display: inline-block;
        }
        .btn-copy { background: #2a2a38; color: #ccc; }
        .btn-copy:hover { background: #3a3a48; }
        .btn-open { background: var(--green); color: #000; }
        .btn-open:hover { background: #00ff84; }
        .btn-dl { background: #ff6600; color: #fff; }
        .btn-dl:hover { background: #ff7722; }

        .no-result {
            background: #1a000a; border: 1px solid #ff3d3d33;
            border-radius: 12px; padding: 20px; text-align: center; color: var(--red);
        }
        .all-dead-banner {
            background: #1a0f00; border: 1px solid #ff910033;
            border-radius: 12px; padding: 16px; text-align: center; margin: 14px 0;
        }
        .all-dead-banner h3 { color: var(--orange); }

        .manual-box { background: #111; border: 1px solid #333; border-radius: 12px; padding: 18px; margin-top: 16px; }
        .manual-box h3 { color: #ffaa00; margin-bottom: 8px; }
        .manual-box ol { padding-right: 20px; color: #aaa; font-size: 0.85em; line-height: 2; }
        .manual-box code { background: #1a1a1a; padding: 2px 8px; border-radius: 4px; color: #ffaa00; font-family: 'Consolas', monospace; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00e676; color: #000; padding: 12px 24px;
            border-radius: 30px; font-weight: 700; font-size: 0.9em;
            z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        .filter-bar {
            display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0;
        }
        .filter-btn {
            padding: 8px 16px; border: 1px solid #333; border-radius: 20px;
            background: transparent; color: #888; cursor: pointer;
            font-size: 0.75em; font-weight: 600; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #555; color: #ccc; }
        .filter-btn.active { border-color: var(--green); color: var(--green); background: #00e67611; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Shadwo PRO - مستخرج M3U8 مع فحص الروابط</h1>
            <p>يستخرج ثم <span style="color:var(--green);">يفحص كل رابط</span> ويعرض <span style="color:var(--green);">الشغالة فقط</span></p>
        </header>

        <div class="card">
            <div class="input-row">
                <input type="text" id="urlInput"
                       value="https://w.shadwo.pro/albaplayer/esref-ruya-s01e01/"
                       placeholder="ضع رابط Shadwo هنا...">
                <button class="btn btn-go" id="goBtn" onclick="startDeepExtract()">🔍 استخراج وفحص</button>
                <button class="btn btn-verify" id="verifyBtn" onclick="verifyExisting()" disabled>✅ فحص الموجود فقط</button>
            </div>

            <div class="stats-bar" id="statsBar" style="display:none;">
                <div class="stat-card">
                    <div class="stat-num orange" id="statTotal">0</div>
                    <div class="stat-label">إجمالي المستخرج</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num green" id="statAlive">0</div>
                    <div class="stat-label">✅ روابط شغالة</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num red" id="statDead">0</div>
                    <div class="stat-label">❌ روابط ميتة</div>
                </div>
            </div>

            <div class="filter-bar" id="filterBar" style="display:none;">
                <button class="filter-btn active" onclick="filterResults('all', this)">الكل</button>
                <button class="filter-btn" onclick="filterResults('alive', this)">✅ الشغالة فقط</button>
                <button class="filter-btn" onclick="filterResults('dead', this)">❌ الميتة فقط</button>
                <button class="filter-btn" onclick="filterResults('m3u8', this)">📡 M3U8 فقط</button>
            </div>
        </div>

        <div class="progress-box" id="progressBox">
            <div id="progressItems"></div>
        </div>

        <div class="results-area" id="resultsArea"></div>

        <div class="manual-box">
            <h3>🛠️ ملاحظة</h3>
            <p style="color:#aaa;font-size:0.85em;">
                الفحص يتم عبر طلب <code>HEAD</code> سريع لكل رابط. الرابط الشغال يرجع كود <code>200</code>.
                الروابط الميتة (403/404) تظهر مشطوبة أو مخفية حسب الفلتر.
            </p>
        </div>
    </div>

    <div class="toast" id="toast">✅ تم النسخ!</div>

    <script>
        // ============ CONFIG ============
        const SERVERS = [
            { id: 1, name: 'CDNPlus', icon: '⚡' },
            { id: 2, name: 'MP4Plus', icon: '🎥' },
            { id: 3, name: 'AnaFast', icon: '🚀' },
            { id: 4, name: 'Vidoba', icon: '📺' },
            { id: 5, name: 'VidSpeed', icon: '💨' },
            { id: 6, name: 'Larhu', icon: '🔴' },
            { id: 7, name: 'VK', icon: '🔵' },
            { id: 8, name: 'OK', icon: '🟠' },
        ];

        const PROXIES = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://api.codetabs.com/v1/proxy?quest=",
        ];

        // ============ STATE ============
        let allExtractedUrls = []; // { url, source, method, type, status, statusCode }
        let progressState = {};
        let currentFilter = 'all';
        let verificationInProgress = false;

        // ============ DOM ============
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const progressBox = document.getElementById('progressBox');
        const progressItems = document.getElementById('progressItems');
        const resultsArea = document.getElementById('resultsArea');
        const statsBar = document.getElementById('statsBar');
        const filterBar = document.getElementById('filterBar');
        const statTotal = document.getElementById('statTotal');
        const statAlive = document.getElementById('statAlive');
        const statDead = document.getElementById('statDead');
        const toast = document.getElementById('toast');

        // ============ HELPERS ============
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateProgress(id, name, icon, status, detail) {
            progressState[id] = { name, icon, status, detail };
            renderProgress();
        }

        function renderProgress() {
            progressBox.classList.add('active');
            let html = '';
            for (const [id, state] of Object.entries(progressState)) {
                const statusClass = state.status === 'done' ? 'done' : 
                                   state.status === 'running' ? 'running' : 
                                   state.status === 'skip' ? 'skip' : 'fail';
                html += `
                <div class="progress-item">
                    <span class="prog-icon">${state.icon}</span>
                    <span class="prog-name">${state.name}</span>
                    <span class="prog-status ${statusClass}">${state.detail}</span>
                </div>`;
            }
            progressItems.innerHTML = html;
        }

        function updateStats() {
            const total = allExtractedUrls.length;
            const alive = allExtractedUrls.filter(u => u.status === 'alive').length;
            const dead = allExtractedUrls.filter(u => u.status === 'dead').length;
            const checking = allExtractedUrls.filter(u => u.status === 'checking').length;

            statTotal.textContent = total;
            statAlive.textContent = alive;
            statDead.textContent = dead;

            statsBar.style.display = 'flex';
            filterBar.style.display = 'flex';
            verifyBtn.disabled = (total === 0 || verificationInProgress);
        }

        function renderResults() {
            updateStats();

            let filteredUrls = allExtractedUrls;
            if (currentFilter === 'alive') {
                filteredUrls = allExtractedUrls.filter(u => u.status === 'alive');
            } else if (currentFilter === 'dead') {
                filteredUrls = allExtractedUrls.filter(u => u.status === 'dead');
            } else if (currentFilter === 'm3u8') {
                filteredUrls = allExtractedUrls.filter(u => u.type === 'm3u8');
            }

            if (filteredUrls.length === 0) {
                if (currentFilter === 'alive') {
                    resultsArea.innerHTML = `
                        <div class="all-dead-banner">
                            <h3>⚠️ لا توجد روابط شغالة حالياً</h3>
                            <p style="color:#aaa;font-size:0.8em;">جميع الروابط المستخرجة ميتة أو منتهية الصلاحية. جرب استخراج جديد.</p>
                        </div>`;
                } else {
                    resultsArea.innerHTML = '';
                }
                return;
            }

            // ترتيب: الشغالة أولاً، ثم m3u8، ثم الباقي
            filteredUrls.sort((a, b) => {
                if (a.status === 'alive' && b.status !== 'alive') return -1;
                if (a.status !== 'alive' && b.status === 'alive') return 1;
                if (a.type === 'm3u8' && b.type !== 'm3u8') return -1;
                if (a.type !== 'm3u8' && b.type === 'm3u8') return 1;
                return 0;
            });

            let html = '';
            for (const item of filteredUrls) {
                const isAlive = item.status === 'alive';
                const isChecking = item.status === 'checking';
                const isDead = item.status === 'dead';
                const isBest = isAlive && item.type === 'm3u8' && (item.url.includes('cdnz.online') || item.url.includes('albrq'));

                const tagClass = isChecking ? 'tag-checking' :
                                isBest ? 'tag-best' :
                                isAlive ? 'tag-live' :
                                isDead ? 'tag-dead' : 'tag-m3u8';

                const tagText = isChecking ? '⏳ جاري الفحص...' :
                               isBest ? '⭐ M3U8 شغال' :
                               isAlive ? '✅ شغال (' + (item.statusCode || 'OK') + ')' :
                               isDead ? '❌ ميت (' + (item.statusCode || 'Error') + ')' :
                               '📎 ' + item.type.toUpperCase();

                const cardClass = isDead ? ' dead' : (isBest ? ' best' : '');
                const linkClass = isDead ? ' dead-link' : '';
                const escaped = item.url.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                html += `
                <div class="result-item${cardClass}" data-url="${escaped}" data-status="${item.status}">
                    <div class="result-top">
                        <span class="tag ${tagClass}">${tagText}</span>
                        <span style="color:#666;font-size:0.7em;">${item.source} | ${item.method} | ${item.time || ''}</span>
                    </div>
                    <div class="link-box${linkClass}">${item.url}</div>
                    <div class="actions">
                        ${isAlive ? `
                            <button class="btn-sm btn-copy" onclick="copyText('${escaped}', this)">📋 نسخ</button>
                            <a class="btn-sm btn-open" href="${item.url}" target="_blank" rel="noopener">▶️ فتح</a>
                            <a class="btn-sm btn-dl" href="${item.url}" download>⬇️ تحميل</a>
                        ` : `
                            <button class="btn-sm btn-copy" onclick="copyText('${escaped}', this)" style="opacity:0.5;">📋 نسخ</button>
                            <span style="color:#555;font-size:0.7em;">الرابط غير صالح</span>
                        `}
                    </div>
                </div>`;
            }

            resultsArea.innerHTML = html;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✅ تم!';
                btn.style.background = '#00e676';
                btn.style.color = '#000';
                setTimeout(() => {
                    btn.textContent = orig;
                    btn.style.background = '#2a2a38';
                    btn.style.color = '#ccc';
                }, 1800);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed'; ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ تم النسخ!');
            });
        }

        function filterResults(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderResults();
        }

        // ============ FETCH ============
        async function fetchWithProxy(url, proxyIdx = 0) {
            if (proxyIdx >= PROXIES.length) {
                try {
                    const res = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
                    if (res.ok) return await res.text();
                } catch(e) {}
                throw new Error('كل الطرق فشلت');
            }
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 15000);
            try {
                const res = await fetch(PROXIES[proxyIdx] + encodeURIComponent(url), {
                    headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept': '*/*' },
                    signal: ctrl.signal
                });
                clearTimeout(t);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.text();
            } catch(e) {
                clearTimeout(t);
                return fetchWithProxy(url, proxyIdx + 1);
            }
        }

        // ============ VERIFICATION ENGINE ============
        async function verifyUrl(url) {
            const proxies = [
                "https://api.allorigins.win/raw?url=",
                "https://corsproxy.io/?",
                "https://api.codetabs.com/v1/proxy?quest=",
            ];

            for (const proxy of proxies) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 8000);
                    const checkUrl = proxy + encodeURIComponent(url);

                    const res = await fetch(checkUrl, {
                        method: 'HEAD',
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                            'Accept': '*/*',
                        },
                        signal: ctrl.signal
                    });
                    clearTimeout(t);

                    if (res.ok) {
                        return { alive: true, code: res.status };
                    } else if (res.status === 403 || res.status === 404 || res.status === 410) {
                        return { alive: false, code: res.status };
                    }
                    // إذا كان الرد غير 200/403/404، نكمل للبروكسي التالي
                } catch(e) {
                    continue;
                }
            }

            // محاولة أخيرة: طلب GET صغير
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 6000);
                const res = await fetch(url, {
                    method: 'HEAD',
                    headers: { 'User-Agent': 'Mozilla/5.0' },
                    signal: ctrl.signal
                });
                clearTimeout(t);
                if (res.ok) return { alive: true, code: res.status };
                if (res.status === 403) return { alive: false, code: 403 };
                if (res.status === 404) return { alive: false, code: 404 };
                return { alive: false, code: res.status };
            } catch(e) {
                return { alive: false, code: 'Error' };
            }
        }

        async function verifyAllUrls() {
            if (verificationInProgress) return;
            verificationInProgress = true;
            verifyBtn.disabled = true;
            goBtn.disabled = true;

            const urlsToVerify = allExtractedUrls.filter(u => u.status === 'unknown' || u.status === 'checking');
            
            if (urlsToVerify.length === 0) {
                showToast('كل الروابط تم فحصها مسبقاً');
                verificationInProgress = false;
                verifyBtn.disabled = false;
                goBtn.disabled = false;
                return;
            }

            updateProgress('verify', 'فحص الروابط', '🔍', 'running', `0/${urlsToVerify.length}`);

            let verified = 0;
            const batchSize = 3; // نفحص 3 روابط مع بعض

            for (let i = 0; i < urlsToVerify.length; i += batchSize) {
                const batch = urlsToVerify.slice(i, i + batchSize);
                const results = await Promise.allSettled(
                    batch.map(async (item) => {
                        const result = await verifyUrl(item.url);
                        item.status = result.alive ? 'alive' : 'dead';
                        item.statusCode = result.code;
                        return item;
                    })
                );

                verified += batch.length;
                updateProgress('verify', 'فحص الروابط', '🔍', 'running', `${verified}/${urlsToVerify.length}`);
                renderResults();
            }

            const aliveCount = urlsToVerify.filter(u => u.status === 'alive').length;
            const deadCount = urlsToVerify.filter(u => u.status === 'dead').length;

            updateProgress('verify', 'فحص الروابط', '🔍', 'done',
                `${aliveCount} شغال, ${deadCount} ميت`);
            updateStats();
            renderResults();

            verificationInProgress = false;
            verifyBtn.disabled = false;
            goBtn.disabled = false;

            if (aliveCount === 0 && allExtractedUrls.length > 0) {
                showToast('⚠️ جميع الروابط ميتة - جرب رابط مختلف');
            } else if (aliveCount > 0) {
                showToast(`✅ تم العثور على ${aliveCount} رابط شغال`);
                // تلقائياً فلترة للشغالة فقط
                filterResults('alive', document.querySelector('.filter-btn:nth-child(2)'));
            }
        }

        // ============ EXTRACTION ============
        function extractIframes(html) {
            const r = /<iframe[^>]+src=["']([^"']+)["']/gi;
            const out = [];
            let m;
            while ((m = r.exec(html))) out.push(m[1]);
            return [...new Set(out)];
        }

        function extractVideoId(url) {
            const m = url.match(/embed-([a-z0-9]+)\.html/i);
            if (m) return m[1];
            const m2 = url.match(/[?&]id=([a-z0-9]+)/i);
            if (m2) return m2[1];
            return null;
        }

        function extractAllUrls(html) {
            const found = [];
            const r1 = /https?:\/\/[^\s"'<>]*\.m3u8[^\s"'<>]*/gi;
            let m;
            while ((m = r1.exec(html))) found.push(m[0]);
            const r2 = /https?:\/\/[^\s"'<>]*cdnz\.online[^\s"'<>]*/gi;
            while ((m = r2.exec(html))) found.push(m[0]);
            const r3 = /https?:\/\/[^\s"'<>]*albrq[^\s"'<>]*/gi;
            while ((m = r3.exec(html))) found.push(m[0]);
            const r4 = /https?:\/\/[^\s"'<>]*(?:hls\/|token=|index-v1|manifest)[^\s"'<>]*/gi;
            while ((m = r4.exec(html))) {
                if (!found.includes(m[0])) found.push(m[0]);
            }
            const r5 = /["']((?:https?:)?\/\/[^"']*(?:cdnz|albrq|hls|stream|m3u8|mp4|token)[^"']{10,})["']/gi;
            while ((m = r5.exec(html))) {
                let u = m[1];
                if (u.startsWith('//')) u = 'https:' + u;
                if (!found.includes(u)) found.push(u);
            }
            const r6 = /atob\s*\(\s*["']([A-Za-z0-9+/=]{20,})["']\s*\)/g;
            while ((m = r6.exec(html))) {
                try {
                    const decoded = atob(m[1]);
                    const nested = extractAllUrls(decoded);
                    found.push(...nested);
                } catch(e) {}
            }
            return [...new Set(found)];
        }

        function buildApiUrls(videoId) {
            return [
                `https://albrq-cdn1-lcd.cdnz.online/hls2/02/00005/${videoId}_l/index-v1-a1.m3u8`,
                `https://albrq-cdn1-lcd.cdnz.online/hls/02/00005/${videoId}/index-v1-a1.m3u8`,
                `https://albrq-store1-tgb.cdnz.quest/hls2/02/00005/${videoId}_l/index-v1-a1.m3u8`,
                `https://albrq-store1-tgb.cdnz.quest/hls/02/00005/${videoId}/index-v1-a1.m3u8`,
                `https://cdnplus.cyou/api/source/${videoId}`,
                `https://cdnplus.cyou/player/index.php?data=${videoId}&do=getVideo`,
            ];
        }

        function addUrl(url, source, method) {
            const lower = url.toLowerCase();
            const type = (lower.includes('.m3u8') || lower.includes('hls') || lower.includes('cdnz')) ? 'm3u8' :
                         (lower.includes('.mp4')) ? 'mp4' : 'stream';

            // نتجنب الصور والملفات الغير فيديو
            if (url.endsWith('.jpg') || url.endsWith('.png') || url.endsWith('.gif') || 
                url.endsWith('.css') || url.endsWith('.js') || url.endsWith('.woff')) return;

            // نتجنب التكرار
            if (allExtractedUrls.find(u => u.url === url)) return;

            allExtractedUrls.push({
                url, source, method, type,
                status: 'unknown',
                statusCode: null,
                time: new Date().toLocaleTimeString()
            });
        }

        // ============ CORE ============
        async function startDeepExtract() {
            const inputUrl = urlInput.value.trim();
            if (!inputUrl) return;

            // Reset
            allExtractedUrls = [];
            progressState = {};
            resultsArea.innerHTML = '';
            statsBar.style.display = 'none';
            filterBar.style.display = 'none';
            progressBox.classList.add('active');
            goBtn.disabled = true;
            verifyBtn.disabled = true;
            currentFilter = 'all';

            const baseUrl = inputUrl.includes('serv=') ? inputUrl : 
                           inputUrl + (inputUrl.includes('?') ? '&' : '?') + 'serv=0';

            // الخطوة 1: الصفحة الرئيسية
            updateProgress('main', 'الصفحة الرئيسية', '🏠', 'running', 'جاري التحميل...');
            try {
                const mainHtml = await fetchWithProxy(baseUrl);
                const mainUrls = extractAllUrls(mainHtml);
                mainUrls.forEach(u => addUrl(u, 'الصفحة الرئيسية', 'HTML'));
                updateProgress('main', 'الصفحة الرئيسية', '🏠', 'done', mainUrls.length + ' روابط');
            } catch(e) {
                updateProgress('main', 'الصفحة الرئيسية', '🏠', 'fail', e.message);
            }

            // الخطوة 2: كل السيرفرات
            for (const srv of SERVERS) {
                const servUrl = baseUrl.replace(/serv=\d+/g, 'serv=' + srv.id);
                updateProgress('srv' + srv.id, srv.name, srv.icon, 'running', 'جاري الفحص...');

                try {
                    const servHtml = await fetchWithProxy(servUrl);
                    const servUrls = extractAllUrls(servHtml);
                    servUrls.forEach(u => addUrl(u, srv.name, 'HTML'));

                    const iframes = extractIframes(servHtml);
                    for (const iframeUrl of iframes) {
                        updateProgress('srv' + srv.id, srv.name, srv.icon, 'running', 'فحص iframe...');
                        try {
                            const iframeHtml = await fetchWithProxy(iframeUrl);
                            const iframeUrls = extractAllUrls(iframeHtml);
                            iframeUrls.forEach(u => addUrl(u, srv.name, 'iframe'));

                            const vidId = extractVideoId(iframeUrl);
                            if (vidId) {
                                updateProgress('srv' + srv.id, srv.name, srv.icon, 'running', 'بناء API...');
                                const apiUrls = buildApiUrls(vidId);
                                apiUrls.forEach(u => {
                                    if (u.includes('m3u8') || u.includes('cdnz.online')) {
                                        addUrl(u, srv.name, 'API');
                                    }
                                });
                            }
                        } catch(e) {}
                    }
                    updateProgress('srv' + srv.id, srv.name, srv.icon, 'done', 'تم');
                } catch(e) {
                    updateProgress('srv' + srv.id, srv.name, srv.icon, 'fail', e.message);
                }
            }

            // عرض النتائج المستخرجة
            updateStats();
            renderResults();
            goBtn.disabled = false;
            verifyBtn.disabled = false;

            // ==== بدء الفحص التلقائي ====
            updateProgress('verify', 'فحص الروابط تلقائياً', '🔍', 'running', 'جاري...');
            await verifyAllUrls();

            const aliveCount = allExtractedUrls.filter(u => u.status === 'alive').length;
            if (aliveCount === 0) {
                updateProgress('verify', 'فحص الروابط', '🔍', 'done', 'لا توجد روابط شغالة');
            }
        }

        async function verifyExisting() {
            updateProgress('verify', 'إعادة فحص الروابط', '🔍', 'running', 'جاري...');
            // إعادة تعيين حالة الروابط
            allExtractedUrls.forEach(u => {
                u.status = 'unknown';
                u.statusCode = null;
            });
            await verifyAllUrls();
        }

        // ============ EVENTS ============
        urlInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') startDeepExtract();
        });

        console.log('✅ Shadwo PRO Extractor + Link Checker جاهز.');
    </script>
