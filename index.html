<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>HIKAYTNA ULTIMATE SNIFFER</title>
    <style>
        :root { --danger: #ff0000; --bg: #050505; --text: #00ff00; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        .main-box { border: 2px solid var(--danger); background: #000; padding: 30px; border-radius: 15px; max-width: 700px; margin: auto; box-shadow: 0 0 40px rgba(255,0,0,0.4); }
        h1 { color: var(--danger); text-transform: uppercase; margin-bottom: 20px; text-shadow: 0 0 10px var(--danger); }
        input { width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; margin-bottom: 20px; outline: none; }
        input:focus { border-color: var(--danger); box-shadow: 0 0 10px var(--danger); }
        button { width: 100%; padding: 18px; background: var(--danger); color: #fff; border: none; cursor: pointer; font-weight: bold; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #b30000; transform: scale(1.02); }
        #console { margin-top: 20px; font-size: 12px; color: #ff0; min-height: 20px; }
        .result-area { display: none; margin-top: 30px; background: #0a0a0a; border: 1px dashed var(--text); padding: 15px; border-radius: 10px; }
        .direct-link { background: #000; color: var(--text); padding: 12px; font-size: 11px; word-break: break-all; display: block; border: 1px solid #222; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>

<div class="main-box">
    <h1>HIKAYTNA SNIFFER PRO</h1>
    <div style="font-size: 10px; color: #555; margin-bottom: 20px;">[FORCE EXTRACTION MODE ACTIVE]</div>
    
    <input type="text" id="urlInput" placeholder="ضع رابط السيرفر هنا..." value="https://w.shadwo.pro/albaplayer/sahipsizler-s01e06/?serv=2">
    <button onclick="startBruteForce()">إجبار استخراج الرابط (FORCE)</button>
    
    <div id="console">في انتظار الرابط...</div>

    <div class="result-area" id="resZone">
        <span style="color: #fff; font-size: 13px;">✅ تم صيد الرابط المباشر بنجاح:</span>
        <code class="direct-link" id="finalUrl"></code>
        <button style="background: #222; font-size: 12px; padding: 10px;" onclick="copy()">نسخ الرابط المستخرج</button>
    </div>
</div>

<script>
    async function startBruteForce() {
        const input = document.getElementById('urlInput').value;
        const consoleLog = document.getElementById('console');
        const resZone = document.getElementById('resZone');
        const finalUrl = document.getElementById('finalUrl');

        if (!input) return alert("الرابط مطلوب!");

        consoleLog.innerText = "⏳ جاري الهجوم على السيرفر وفك التشفير...";
        resZone.style.display = "none";

        try {
            // استخدام بروكسي "allorigins" الموثوق لجلب المحتوى الخام
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(input)}`);
            const data = await response.json();
            const source = data.contents;

            // خوارزمية الصيد العميق (Deep Regex)
            // تبحث عن m3u8 و mp4 وتتعامل مع التمويه (Slashes)
            const patterns = [
                /https?[:\\]+[\w\.\/-]+\.mp4[\w\?\.=&-]*/gi,
                /https?[:\\]+[\w\.\/-]+\.m3u8[\w\?\.=&-]*/gi,
                /["']file["']\s*:\s*["']([^"']+)["']/
            ];

            let found = null;
            for (let p of patterns) {
                let match = source.match(p);
                if (match) {
                    found = (match[1] || match[0]).replace(/\\/g, '').replace(/"/g, '');
                    break;
                }
            }

            if (found) {
                consoleLog.innerText = "🚀 تم الاختراق! الرابط جاهز.";
                consoleLog.style.color = "#00ff00";
                finalUrl.innerText = found;
                resZone.style.display = "block";
            } else {
                consoleLog.innerText = "❌ فشل الاستخراج. السيرفر يستخدم حماية AES؛ جرب سيرفر Vidoba.";
                consoleLog.style.color = "#ff0000";
            }
        } catch (e) {
            consoleLog.innerText = "❌ خطأ في الاتصال بالشبكة (CORS Error).";
            consoleLog.style.color = "#ff0000";
        }
    }

    function copy() {
        navigator.clipboard.writeText(document.getElementById('finalUrl').innerText);
        alert("تم نسخ الرابط! ضعه في مشغل تطبيقك فوراً.");
    }
</script>

</body>
</html>
