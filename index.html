    @media (min-width: 768px) { .drawer { right: -320px; width: 320px; } }
    .drawer.active { right: 0 !important; }
    .drawer-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.8); 
      z-index: 2000; 
      display: none; 
      backdrop-filter: blur(5px); 
    }
    .drawer-overlay.active { display: block !important; }

    #watch-view { 
      display: none; 
      padding-top: 100px; 
      background: #000; 
      min-height: 100vh; 
    }
    @media (min-width: 768px) { #watch-view { padding-top: 120px; } }
    .video-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 768px) { .video-container { padding: 0 50px; } }
    
    .player-holder { 
      width: 100%; 
      aspect-ratio: 16/9; 
      border-radius: 12px; 
      border: 1px solid #1a1a1a; 
      background: #000; 
      box-shadow: 0 0 50px rgba(229, 9, 20, 0.15); 
      overflow: hidden; 
      position: relative; 
    }
    .main-frame, .html5-video { width: 100%; height: 100%; border: none; display: block; background: #000; }

    .server-alert { 
      background: linear-gradient(45deg, rgba(229, 9, 20, 0.15), rgba(0,0,0,0.5));
      color: #ffca28; 
      padding: 15px 25px; 
      border-radius: 50px; 
      margin-bottom: 20px; 
      text-align: center; 
      font-weight: bold; 
      border: 1px solid rgba(255, 202, 40, 0.3);
      font-size: 16px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .server-alert i { color: #ffca28; font-size: 20px; }

    .episode-btn { 
      padding: 0; 
      background: #1a1a1a; 
      border-radius: 8px; 
      cursor: pointer; 
      text-align: center; 
      border: 2px solid transparent; 
      transition: 0.2s; 
      color: #fff; 
      position: relative; 
      overflow: hidden;
      aspect-ratio: 2/3; 
      display: flex;
      flex-direction: column;
    }
    .episode-btn img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.8; transition: 0.2s; }
    .episode-btn:hover img { opacity: 1; }
    .episode-btn .ep-num {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.8);
      padding: 8px 0;
      font-size: 14px;
      font-weight: 800;
      z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .episode-btn.active { border-color: var(--primary) !important; transform: scale(1.05); z-index: 10; }
    .episode-btn.active .ep-num { background: var(--primary); color: #fff; }
    
    .episode-btn.watched::after { 
      content: '\f058'; 
      font-family: "Font Awesome 6 Free"; 
      font-weight: 900; 
      position: absolute; 
      top: 5px; 
      left: 5px; 
      color: #fff; 
      background: var(--primary); 
      border-radius: 50%; 
      font-size: 12px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .v-likes-btn { cursor:pointer; transition:0.2s; }
    .v-likes-btn.active { color: var(--primary); transform: scale(1.1); }

    .rating-stars { display: flex; gap: 5px; direction: ltr; margin: 10px 0; }
    .star { font-size: 24px; color: #444; cursor: pointer; transition: 0.2s; }
    .star.active, .star:hover { color: #ffd700; }
    .star.half { position: relative; }
    .star.half:before { content: '★'; position: absolute; left: 0; width: 50%; overflow: hidden; color: #ffd700; }

    .loader { 
      position: fixed; 
      inset: 0; 
      background: #050505; 
      z-index: 9999; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column; 
      gap: 20px; 
    }
    .spinner { 
      width: 60px; 
      height: 60px; 
      border: 5px solid #1a1a1a; 
      border-top-color: var(--primary); 
      border-radius: 50%; 
      animation: spin 0.8s infinite linear; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .site-footer {
      padding: 30px 20px;
      background: #050505;
      border-top: 1px solid #1a1a1a;
      text-align: center;
      margin-top: 40px;
    }
    .footer-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer-copy { font-size: 16px; font-weight: 400; color: #fff; background: transparent; padding: 0; }
    .footer-tg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
      gap: 5px;
    }
    .footer-tg i { font-size: 18px; color: #0088cc; transition: 0.2s; }
    .footer-tg:hover { color: #0088cc; }
    .footer-tg:hover i { transform: scale(1.1); }

    .install-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Cairo';
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
      display: none;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      animation: pulse-install 2s infinite;
    }
    .install-button.show { display: flex; }
    .install-button:hover { transform: scale(1.05); background: #ff0f1a; }
    @keyframes pulse-install {
      0% { box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
      50% { box-shadow: 0 4px 25px rgba(229, 9, 20, 0.6); }
      100% { box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
    }

    .quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px 20px 0; visibility: hidden; }
    .stat-item {
      background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
      border-radius: 16px;
      padding: 20px 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .stat-number { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
    .stat-label { font-size: 13px; color: #aaa; }
    
    .back-to-top {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 45px;
      height: 45px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
      box-shadow: 0 5px 20px rgba(229, 9, 20, 0.3);
    }
    .back-to-top.show { opacity: 1; visibility: visible; }
    
    .share-buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .share-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }
    .share-whatsapp { background: #25D366; }
    .share-telegram { background: #0088cc; }
    .share-copy { background: #666; cursor: pointer; }
    
    .copy-toast {
      position: fixed;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 15px;
      z-index: 10000;
      display: none;
    }
    .copy-toast.show { display: block; animation: fadeInOut 2s; }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
      content-visibility: auto;
      contain-intrinsic-size: 300px;
    }
    @media (min-width: 768px) { .suggestions-grid { grid-template-columns: repeat(5, 1fr); } }

    .watched-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--primary);
      width: 0%;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 30px 0 20px;
      flex-wrap: wrap;
      padding: 10px;
    }
    
    .page-btn {
      min-width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text-dim);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
      padding: 0 10px;
    }
    
    .page-btn:hover {
      background: var(--bg-hover);
      border-color: var(--primary);
      color: #fff;
    }
    
    .page-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    
    .page-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    
    .page-dots {
      color: var(--text-dim);
      padding: 0 5px;
      font-size: 18px;
    }

    #episodes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      content-visibility: auto;
      contain-intrinsic-size: 200px;
    }
    @media (min-width: 576px) { #episodes-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 768px) { #episodes-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 992px) { #episodes-grid { grid-template-columns: repeat(6, 1fr); } }

        midPageAd.classList.add('show');

      }
      toggleMute();

      const data = snapshot.val();
      if (data) {
        allData = Object.keys(data).map(key => ({ 
          id: key, 
          ...data[key],
          title: data[key].title || key.replace(/_/g, ' '),
          rating: data[key].rating || 0,
          ratingCount: data[key].ratingCount || 0
        }));
        
        allData.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        filteredData = [...allData];
        
        resetPagination();
        renderAll();
        updateStats();
        setTimeout(() => { document.getElementById('site-loader').style.display='none'; }, 800);
      }

    function resetPagination() {
      currentPage = 1;
      totalPages = Math.ceil(filteredData.length / itemsPerPage);
      displayedData = filteredData.slice(0, itemsPerPage);
      renderPagination();
    }

    function renderPagination() {
      const paginationEl = document.getElementById('pagination');
      if (!paginationEl) return;
      
      if (totalPages <= 1) {
        paginationEl.innerHTML = '';
        return;
      }
      
      let html = '';
      html += `<div class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})">
        <i class="fas fa-chevron-right"></i>
      </div>`;
      
      if (currentPage > 3) {
        html += `<div class="page-btn" onclick="changePage(1)">1</div>`;
        if (currentPage > 4) html += `<span class="page-dots">...</span>`;
      }
      
      for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
        html += `<div class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</div>`;
      }
      
      if (currentPage < totalPages - 2) {
        if (currentPage < totalPages - 3) html += `<span class="page-dots">...</span>`;
        html += `<div class="page-btn" onclick="changePage(${totalPages})">${totalPages}</div>`;
      }
      
      html += `<div class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})">
        <i class="fas fa-chevron-left"></i>
      </div>`;
      
      paginationEl.innerHTML = html;
    }

    window.changePage = function(page) {
      if (page < 1 || page > totalPages || page === currentPage) return;
      
      currentPage = page;
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      displayedData = filteredData.slice(start, end);
      
      renderGrid(displayedData);
      renderPagination();
      
      document.querySelector('.main-content-wrapper').scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    };

    function updateStats() {
      let totalViews = 0;
      let totalRating = 0;
      allData.forEach(item => {

      });
      document.getElementById('stat-series').innerText = allData.length;
      document.getElementById('stat-views').innerText = totalViews.toLocaleString();
      document.getElementById('stat-likes').innerText = (allData.length > 0 ? (totalRating / allData.length).toFixed(1) : '0') + ' ★';
    }

    function renderAll() {
      resetPagination();
      renderGrid(displayedData);
      renderSlider();
    }

function levenshteinDistance(a, b) {
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i-1) === a.charAt(j-1)) {
        matrix[i][j] = matrix[i-1][j-1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i-1][j-1] + 1,
          matrix[i][j-1] + 1,
          matrix[i-1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

function similarity(a, b) {
  a = a.toLowerCase();
  b = b.toLowerCase();
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.9;
  const distance = levenshteinDistance(a, b);
  const maxLength = Math.max(a.length, b.length);
  return maxLength === 0 ? 1 : (maxLength - distance) / maxLength;
}

function performSearch(query) {
  query = query.toLowerCase().trim();
  
  if (query.length < 2) {
    document.getElementById('search-suggestions').classList.remove('active');
    filteredData = [...allData];
    resetPagination();
    renderGrid(displayedData);
    renderPagination();
    return;
  }
  
  let results = allData.map(item => {
    const titleLower = item.title.toLowerCase();
    const exactMatch = titleLower.includes(query);
    const simScore = similarity(titleLower, query);
    
    return {
      ...item,
      score: exactMatch ? 1 : simScore
    };
  }).filter(item => item.score > 0.4)
    .sort((a, b) => b.score - a.score);
  
  filteredData = results;
  resetPagination();
  renderGrid(displayedData);
  renderPagination();
  
  showSearchSuggestions(results.slice(0, 5));
}

      const urlLower = url.toLowerCase();

      for (let ext of videoExtensions) {
        if (urlLower.includes(ext)) return true;
      }
      
      const protectedVideoPatterns = [
        'vid', 'video', 'stream', 'embed', 'watch', 'zvde-dsn',
        '.net/', '.site/', '.org/', '.io/', '/video/', '/stream/'
      ];
      
      for (let pattern of protectedVideoPatterns) {
        if (urlLower.includes(pattern)) return true;
      }
      return false;
    }

  if (url.includes('w.shadwo.pro')) {
    try {
      const cleanUrl = await extractCleanVideo(url);
      if (cleanUrl) {
        playCleanVideo(cleanUrl, container);
        return;
      }
    } catch(e) {
      console.log('فشل استخراج الفيديو النظيف:', e);
    }
    
    // لو فشل الاستخراج، استخدم iframe مع serv=0
    let embedUrl = url;
    if (!embedUrl.includes('serv=')) {
      embedUrl = embedUrl + (embedUrl.includes('?') ? '&' : '?') + 'serv=0';
    }
    container.innerHTML = '<iframe class="main-frame" src="' + embedUrl + '" allowfullscreen frameborder="0" allow="autoplay; fullscreen; encrypted-media" style="width:100%; height:100%; border:none;"></iframe>';
    return;
  }
  
  // ========== للروابط الأخرى (zvde-dsn, mp4, m3u8) ==========
  if (url.includes('.mp4') || url.includes('.m3u8') || url.includes('zvde-dsn')) {
    playDirectVideo(url, container);
    return;
  }
  
  // ========== iframe عادي لأي روابط أخرى ==========
  container.innerHTML = '<iframe class="main-frame" src="' + url + '" allowfullscreen frameborder="0" allow="autoplay; fullscreen; encrypted-media" style="width:100%; height:100%; border:none;"></iframe>';
}

// ========== دالة استخراج الفيديو النظيف من w.shadwo.pro ==========
async function extractCleanVideo(pageUrl) {
  try {
    // جلب صفحة shadwo
    const response = await fetch(pageUrl);
    const html = await response.text();
    
    // 1. البحث عن رابط VK (أنظف سيرفر - بدون إعلانات)
    const vkMatch = html.match(/(?:vk\.com|userapi\.com)\/video_ext\.php\?[^"'\s]+/i) || 
                    html.match(/src="([^"]*vk\.com[^"]*video[^"]*)"/i);
    if (vkMatch) {
      const vkUrl = vkMatch[1] || vkMatch[0];
      console.log('✅ تم العثور على VK (بدون إعلانات)');
      return vkUrl.startsWith('http') ? vkUrl : 'https://' + vkUrl;
    }
    
    // 2. البحث عن رابط OK.ru
    const okMatch = html.match(/(?:ok\.ru|odnoklassniki\.ru)\/videoembed\/[^"'\s]+/i) ||
                    html.match(/src="([^"]*ok\.ru[^"]*video[^"]*)"/i);
    if (okMatch) {
      const okUrl = okMatch[1] || okMatch[0];
      console.log('✅ تم العثور على OK (بدون إعلانات)');
      return okUrl.startsWith('http') ? okUrl : 'https://' + okUrl;
    }
    
    // 3. البحث عن رابط m3u8 مباشر
    const m3u8Match = html.match(/(https?:\/\/[^\s"']+\.m3u8[^\s"']*)/i) ||
                      html.match(/source\s+src="([^"]+\.m3u8[^"]*)"/i) ||
                      html.match(/file:\s*["']([^"']+\.m3u8[^"']*)["']/i);
    if (m3u8Match) {
      const m3u8Url = m3u8Match[1] || m3u8Match[0];
      console.log('✅ تم العثور على m3u8 مباشر');
      return m3u8Url;
    }
    
    // 4. البحث عن رابط mp4 مباشر
    const mp4Match = html.match(/(https?:\/\/[^\s"']+\.mp4[^\s"']*)/i) ||
                     html.match(/source\s+src="([^"]+\.mp4[^"]*)"/i);
    if (mp4Match) {
      const mp4Url = mp4Match[1] || mp4Match[0];
      console.log('✅ تم العثور على mp4 مباشر');
      return mp4Url;
    }
    
    // 5. البحث عن رابط Vidoba
    const vidobaMatch = html.match(/https?:\/\/[^\s"']*vidoba[^\s"']*/i);
    if (vidobaMatch) {
      console.log('⚠️ تم العثور على Vidoba (قد يحتوي إعلانات)');
      return vidobaMatch[0];
    }
    
    return null;
    
  } catch(e) {
    console.error('❌ فشل استخراج الفيديو:', e);
    return null;
  }
}

// ========== دالة تشغيل الفيديو النظيف ==========
function playCleanVideo(videoUrl, container) {
  // لو VK أو OK - iframe مباشر
  if (videoUrl.includes('vk.com') || videoUrl.includes('ok.ru') || videoUrl.includes('youtube.com')) {
    container.innerHTML = '<iframe class="main-frame" src="' + videoUrl + '" allowfullscreen frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" style="width:100%; height:100%; border:none;"></iframe>';
    return;
  }
  
  // لو m3u8 أو mp4 - مشغل HTML5
  if (videoUrl.includes('.m3u8') || videoUrl.includes('.mp4')) {
    playDirectVideo(videoUrl, container);
    return;
  }
  
  // غير ذلك - iframe
  container.innerHTML = '<iframe class="main-frame" src="' + videoUrl + '" allowfullscreen frameborder="0" allow="autoplay; fullscreen; encrypted-media" style="width:100%; height:100%; border:none;"></iframe>';
}

// ========== دالة تشغيل الفيديو المباشر (مع حفظ التقدم) ==========
function playDirectVideo(videoUrl, container) {
  container.innerHTML = '';
  
  const video = document.createElement('video');
  video.className = 'html5-video';
  video.controls = true;
  video.autoplay = true;
  video.playsinline = true;
  video.controlsList = 'nodownload';
  video.oncontextmenu = () => false;
  video.disablePictureInPicture = true;
  video.setAttribute('preload', 'auto');
  
  let retryCount = 0;
  const maxRetries = 3;
  let lastSavedTime = 0;
  let saveInterval = null;
  
  function saveProgress() {
    if (video.currentTime > 0 && video.duration > 0) {
      const progress = (video.currentTime / video.duration) * 100;
      
      if (!watchProgress[currentId]) watchProgress[currentId] = {};
      watchProgress[currentId] = {
        time: video.currentTime,
        episode: currentEpisodeIndex,
        duration: video.duration,
        progress: progress
      };
      
      localStorage.setItem('watch_progress', JSON.stringify(watchProgress));
      localStorage.setItem('last_watched_' + currentId, JSON.stringify({
        time: video.currentTime,
        episode: currentEpisodeIndex,
        timestamp: Date.now()
      }));
      
      lastSavedTime = video.currentTime;
      console.log('✅ تم حفظ التقدم:', Math.round(progress) + '%');
    }
  }
  
  video.addEventListener('play', function() {
    if (saveInterval) clearInterval(saveInterval);
    saveInterval = setInterval(saveProgress, 5000);
  });
  
  video.addEventListener('pause', saveProgress);
  video.addEventListener('ended', function() {
    saveProgress();
    if (saveInterval) clearInterval(saveInterval);
  });
  
  window.addEventListener('beforeunload', saveProgress);
  
  const savedProgress = watchProgress[currentId];
  const lastWatched = JSON.parse(localStorage.getItem('last_watched_' + currentId) || '{}');
  
  if (savedProgress && savedProgress.episode === currentEpisodeIndex && savedProgress.time > 5) {
    video.addEventListener('loadedmetadata', function() {
      setTimeout(() => { video.currentTime = savedProgress.time; }, 300);
    });
  } else if (lastWatched.episode === currentEpisodeIndex && lastWatched.time > 5) {
    video.addEventListener('loadedmetadata', function() {
      setTimeout(() => { video.currentTime = lastWatched.time; }, 300);
    });
  }
  
  video.addEventListener('error', function(e) {
    console.log('❌ خطأ في التحميل، المحاولة:', retryCount + 1);
    saveProgress();
    
    if (retryCount < maxRetries) {
      retryCount++;
      setTimeout(() => {
        const currentTime = video.currentTime;
        video.innerHTML = '';
        const newSource = document.createElement('source');
        
        let newUrl = videoUrl;
        if (videoUrl.includes('zvde-dsn') && !videoUrl.includes('raw=true')) {
          newUrl = videoUrl.includes('?') ? videoUrl + '&raw=true' : videoUrl + '?raw=true';
        }
        newUrl = newUrl + (newUrl.includes('?') ? '&' : '?') + 'retry=' + Date.now();
        
        newSource.src = newUrl;
        newSource.type = videoUrl.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
        video.appendChild(newSource);
        video.load();
        
        video.addEventListener('loadedmetadata', function() {
          if (currentTime > 5) video.currentTime = currentTime;
          else if (lastSavedTime > 5) video.currentTime = lastSavedTime;
          video.play().catch(() => {});
        }, { once: true });
        
      }, 2000 * retryCount);
    } else {
      container.innerHTML = '<div style="color:#e50914; text-align:center; padding:40px;">⚠️ تعذر تحميل الفيديو. <br><br> <button onclick="location.reload()" style="background:#e50914; color:#fff; border:none; padding:10px 30px; border-radius:30px; cursor:pointer; font-family:Cairo;">🔄 تحديث الصفحة</button></div>';
    }
  });
  
  video.addEventListener('stalled', function() {
    console.log('⏸️ انقطع الاتصال، جاري إعادة المحاولة...');
    saveProgress();
    if (video.readyState < 3) {
      setTimeout(() => {
        video.load();
        video.play().catch(() => {});
      }, 1500);
    }
  });
  
  const source = document.createElement('source');
  let finalUrl = videoUrl;
  if (finalUrl.includes('zvde-dsn') && !finalUrl.includes('raw=true')) {
    finalUrl = finalUrl.includes('?') ? finalUrl + '&raw=true' : finalUrl + '?raw=true';
  }
  
  source.src = finalUrl;
  source.type = videoUrl.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
  video.appendChild(source);
  container.appendChild(video);
  
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.removedNodes.length > 0) {
        if (saveInterval) clearInterval(saveInterval);
        observer.disconnect();
      }
    });
  });
  observer.observe(container, { childList: true });
}
