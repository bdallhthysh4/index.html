<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1"/>
    <title>Shadwo PRO - مستخرج روابط MP4 المباشرة</title>
    <style>
        :root {
            --bg: #0a0a0f; --card: #111118; --border: #222230;
            --green: #00e676; --red: #ff3d3d; --orange: #ff9100; --text: #c8c8d0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text); min-height: 100vh; padding: 16px;
        }
        .container { max-width: 960px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 18px; }
        header h1 { font-size: 1.6em; color: var(--green); }
        header p { color: #666; font-size: 0.8em; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
        .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .input-row input {
            flex: 1; min-width: 200px; padding: 13px;
            background: #0b0b14; border: 2px solid #2a2a38; border-radius: 10px;
            color: #fff; font-family: 'Consolas', monospace; font-size: 0.85em;
        }
        .input-row input:focus { outline: none; border-color: var(--green); }
        .btn {
            padding: 13px 22px; border: none; border-radius: 10px;
            font-weight: 700; font-size: 0.9em; cursor: pointer; transition: all 0.25s; white-space: nowrap;
        }
        .btn-go { background: var(--green); color: #000; }
        .btn-go:hover { background: #00ff84; }
        .btn-go:disabled { background: #2a2a38; color: #555; cursor: not-allowed; }

        .log-panel {
            background: #0a0a10; border: 1px solid #1a1a2a; border-radius: 10px;
            padding: 12px; font-family: 'Consolas', monospace; font-size: 0.7em;
            color: #0f0; max-height: 180px; overflow-y: auto; white-space: pre-wrap;
            word-break: break-all; margin: 10px 0; display: none;
        }
        .log-panel.active { display: block; }

        .results-area { margin-top: 14px; }
        .result-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 8px;
            transition: all 0.2s;
        }
        .result-item.best {
            border-color: var(--green); box-shadow: 0 0 25px rgba(0,230,118,0.15);
            background: #0a1a11;
        }
        .result-top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
        }
        .tag {
            padding: 5px 12px; border-radius: 14px; font-weight: 800; font-size: 0.68em;
        }
        .tag-alive { background: #00e67622; color: var(--green); border: 1px solid #00e67644; }
        .tag-dead { background: #ff3d3d22; color: var(--red); border: 1px solid #ff3d3d44; }
        .link-box {
            background: #050510; border: 1px solid #1a1a2a; border-radius: 8px;
            padding: 12px; font-family: 'Consolas', monospace; font-size: 0.7em;
            color: #0f0; word-break: break-all; margin-bottom: 8px;
            user-select: all; max-height: 50px; overflow-y: auto;
            direction: ltr; text-align: left;
        }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-sm {
            padding: 9px 14px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 0.75em; cursor: pointer; transition: all 0.2s;
            text-decoration: none; display: inline-block;
        }
        .btn-copy { background: #2a2a38; color: #ccc; }
        .btn-copy:hover { background: #3a3a48; }
        .btn-open { background: var(--green); color: #000; }
        .btn-open:hover { background: #00ff84; }
        .btn-dl { background: #ff6600; color: #fff; }
        .btn-dl:hover { background: #ff7722; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #00e676; color: #000; padding: 10px 20px;
            border-radius: 25px; font-weight: 700; font-size: 0.85em;
            z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 مستخرج روابط MP4 المباشرة</h1>
            <p>ضع أي رابط Shadwo - يستخرج الروابط المباشرة تلقائياً</p>
        </header>

        <div class="card">
            <div class="input-row">
                <input type="text" id="urlInput"
                       value="https://w.shadwo.pro/albaplayer/esref-ruya-s01e01/"
                       placeholder="ضع رابط Shadwo هنا...">
                <button class="btn btn-go" id="goBtn" onclick="extract()">🔍 استخراج</button>
            </div>
        </div>

        <div class="log-panel" id="logPanel"></div>
        <div class="results-area" id="resultsArea"></div>
    </div>

    <div class="toast" id="toast">✅ تم النسخ!</div>

    <script>
        const PROXIES = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://api.codetabs.com/v1/proxy?quest=",
        ];

        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const logPanel = document.getElementById('logPanel');
        const resultsArea = document.getElementById('resultsArea');
        const toast = document.getElementById('toast');

        let foundUrls = [];
        let logText = '';

        function addLog(msg) {
            logText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logPanel.value = logText;
            logPanel.classList.add('active');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        // ============ FETCH ============
        async function fetchPage(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 12000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept': '*/*' },
                        signal: ctrl.signal
                    });
                    clearTimeout(t);
                    if (res.ok) return await res.text();
                } catch(e) { continue; }
            }
            throw new Error('فشل الاتصال');
        }

        // ============ استخراج ============
        function extractIframes(html) {
            const r = /<iframe[^>]+src=["']([^"']+)["']/gi;
            const out = [];
            let m;
            while ((m = r.exec(html))) out.push(m[1]);
            return [...new Set(out)];
        }

        function extractVideoId(html, url) {
            // من iframe: embed-xxxx.html
            let m = url.match(/embed-([a-z0-9]+)\.html/i);
            if (m) return m[1];
            // من HTML
            m = html.match(/embed-([a-z0-9]+)\.html/i);
            if (m) return m[1];
            // من رابط MP4Plus
            m = url.match(/mp4plus\.\w+\/([a-z0-9]+)\.html/i);
            if (m) return m[1];
            m = html.match(/file_code=([a-z0-9]+)/i);
            if (m) return m[1];
            return null;
        }

        function extractAllUrls(html) {
            const found = [];
            const patterns = [
                /https?:\/\/[^\s"'<>]*aflm[^\s"'<>]*\.mp4[^\s"'<>]*/gi,
                /https?:\/\/[^\s"'<>]*cdnz\.quest[^\s"'<>]*\.mp4[^\s"'<>]*/gi,
                /https?:\/\/[^\s"'<>]*\.m3u8[^\s"'<>]*/gi,
                /https?:\/\/[^\s"'<>]*cdnz\.online[^\s"'<>]*/gi,
                /https?:\/\/[^\s"'<>]*albrq[^\s"'<>]*/gi,
            ];
            for (const p of patterns) {
                let m;
                while ((m = p.exec(html))) {
                    let u = m[0].replace(/["'<>\\]+$/, '');
                    if (!found.includes(u)) found.push(u);
                }
            }
            return found;
        }

        // ============ فحص الرابط ============
        async function checkUrl(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 8000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        method: 'GET',
                        headers: {
                            'User-Agent': 'Mozilla/5.0',
                            'Range': 'bytes=0-1023',
                        },
                        signal: ctrl.signal
                    });
                    clearTimeout(t);
                    if (res.ok || res.status === 206) return true;
                    if (res.status === 403) return 'maybe';
                } catch(e) { continue; }
            }
            // مباشر
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 6000);
                const res = await fetch(url, {
                    method: 'GET',
                    headers: { 'User-Agent': 'Mozilla/5.0', 'Range': 'bytes=0-1023' },
                    signal: ctrl.signal
                });
                clearTimeout(t);
                if (res.ok || res.status === 206) return true;
                if (res.status === 403) return 'maybe';
            } catch(e) {}
            return false;
        }

        // ============ بناء روابط MP4 مباشرة ============
        function buildMp4Urls(videoId) {
            // الأنماط اللي شغالة فعلاً
            return [
                // النمط المباشر من MP4Plus iframe
                `https://aflm-eco2-akf.cdnz.quest/${videoId}/v.mp4`,
                `https://aflm-eco2-akf.cdnz.quest/${videoId}_l/v.mp4`,
                // أنماط إضافية
                `https://aflm-eco2-akf.cdnz.quest/hls/${videoId}/v.mp4`,
                `https://aflm-eco2-akf.cdnz.quest/hls2/${videoId}/v.mp4`,
            ];
        }

        // ============ النتيجة ============
        function addResult(url, source, status) {
            if (foundUrls.find(u => u.url === url)) return;
            foundUrls.push({ url, source, status, time: new Date().toLocaleTimeString() });
            renderResults();
        }

        function renderResults() {
            if (foundUrls.length === 0) {
                resultsArea.innerHTML = '<p style="text-align:center;color:#555;">لا توجد نتائج بعد</p>';
                return;
            }
            const sorted = [...foundUrls].sort((a, b) => {
                if (a.status === true && b.status !== true) return -1;
                if (a.status !== true && b.status === true) return 1;
                return 0;
            });
            let html = '';
            for (const item of sorted) {
                const isAlive = item.status === true;
                const isMaybe = item.status === 'maybe';
                const isBest = isAlive && item.url.includes('.mp4');
                const escaped = item.url.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                html += `
                <div class="result-item${isBest ? ' best' : ''}">
                    <div class="result-top">
                        <span class="tag ${isAlive ? 'tag-alive' : 'tag-dead'}">${isAlive ? '✅ شغال' : (isMaybe ? '⚠️ محتمل' : '❌ ميت')}</span>
                        <span style="color:#666;font-size:0.7em;">${item.source} | ${item.time}</span>
                    </div>
                    <div class="link-box">${item.url}</div>
                    <div class="actions">
                        <button class="btn-sm btn-copy" onclick="copyText('${escaped}', this)">📋 نسخ</button>
                        <a class="btn-sm btn-open" href="${item.url}" target="_blank" rel="noopener">▶️ فتح</a>
                        ${isAlive || isMaybe ? `<a class="btn-sm btn-dl" href="${item.url}" download>⬇️ تحميل</a>` : ''}
                    </div>
                </div>`;
            }
            resultsArea.innerHTML = html;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✅ تم!';
                btn.style.background = '#00e676';
                btn.style.color = '#000';
                setTimeout(() => { btn.textContent = orig; btn.style.background = '#2a2a38'; btn.style.color = '#ccc'; }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed'; ta.style.left = '-9999px';
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ تم النسخ!');
            });
        }

        // ============ CORE ============
        async function extract() {
            const inputUrl = urlInput.value.trim();
            if (!inputUrl) return;

            foundUrls = [];
            logText = '';
            resultsArea.innerHTML = '';
            logPanel.classList.add('active');
            goBtn.disabled = true;

            addLog('🚀 بدء الاستخراج...');
            addLog(`📄 الرابط: ${inputUrl}`);

            const baseUrl = inputUrl.includes('serv=') ? inputUrl :
                           inputUrl + (inputUrl.includes('?') ? '&' : '?') + 'serv=0';

            // نجمع كل video IDs
            const allVideoIds = new Set();
            const allFoundUrls = [];

            // 1. فحص الصفحة الرئيسية
            addLog('📡 فحص الصفحة الرئيسية...');
            try {
                const mainHtml = await fetchPage(baseUrl);
                const mainUrls = extractAllUrls(mainHtml);
                mainUrls.forEach(u => allFoundUrls.push({ url: u, source: 'الرئيسية' }));
                const mainId = extractVideoId(mainHtml, baseUrl);
                if (mainId) allVideoIds.add(mainId);
                addLog(`✅ الرئيسية: ${mainUrls.length} روابط, ID: ${mainId || 'لا يوجد'}`);
            } catch(e) {
                addLog(`❌ فشل الرئيسية: ${e.message}`);
            }

            // 2. فحص كل سيرفر
            const servers = [
                { id: 1, name: 'CDNPlus' },
                { id: 2, name: 'MP4Plus' },
                { id: 3, name: 'AnaFast' },
                { id: 4, name: 'Vidoba' },
                { id: 5, name: 'VidSpeed' },
                { id: 6, name: 'Larhu' },
                { id: 7, name: 'VK' },
                { id: 8, name: 'OK' },
            ];

            for (const srv of servers) {
                const servUrl = baseUrl.replace(/serv=\d+/g, 'serv=' + srv.id);
                addLog(`🔍 فحص ${srv.name}...`);
                try {
                    const servHtml = await fetchPage(servUrl);
                    const servUrls = extractAllUrls(servHtml);
                    servUrls.forEach(u => allFoundUrls.push({ url: u, source: srv.name }));
                    
                    const servId = extractVideoId(servHtml, servUrl);
                    if (servId) allVideoIds.add(servId);

                    // فحص iframes
                    const iframes = extractIframes(servHtml);
                    for (const iframeUrl of iframes) {
                        addLog(`  📺 iframe: ${iframeUrl.substring(0, 60)}...`);
                        try {
                            const iframeHtml = await fetchPage(iframeUrl);
                            const iframeUrls = extractAllUrls(iframeHtml);
                            iframeUrls.forEach(u => allFoundUrls.push({ url: u, source: srv.name + ' iframe' }));
                            
                            const iframeId = extractVideoId(iframeHtml, iframeUrl);
                            if (iframeId) allVideoIds.add(iframeId);
                        } catch(e) {
                            addLog(`  ⚠️ فشل iframe: ${e.message}`);
                        }
                    }
                    addLog(`  ✅ ${srv.name}: ${servUrls.length} روابط`);
                } catch(e) {
                    addLog(`  ❌ فشل ${srv.name}: ${e.message}`);
                }
            }

            // 3. بناء روابط MP4 من كل video ID
            addLog(`\n🎯 تم العثور على ${allVideoIds.size} Video IDs`);
            const mp4Candidates = [];
            for (const vidId of allVideoIds) {
                const urls = buildMp4Urls(vidId);
                urls.forEach(u => mp4Candidates.push({ url: u, source: 'MP4 Builder' }));
                addLog(`  🏗️ ID: ${vidId} → ${urls.length} روابط محتملة`);
            }

            // 4. دمج الكل
            const allCandidates = [...allFoundUrls, ...mp4Candidates];
            // إزالة التكرار
            const unique = [];
            const seen = new Set();
            for (const item of allCandidates) {
                if (!seen.has(item.url) && item.url.length > 20 && item.url.startsWith('http')) {
                    seen.add(item.url);
                    unique.push(item);
                }
            }

            addLog(`\n📦 إجمالي الروابط الفريدة: ${unique.length}`);

            // 5. فحص الروابط
            addLog('🔍 جاري فحص الروابط...');
            const mp4Links = unique.filter(u => u.url.includes('.mp4') || u.url.includes('aflm'));
            const otherLinks = unique.filter(u => !mp4Links.includes(u));

            // نفحص MP4 أولاً
            let aliveCount = 0;
            for (const item of mp4Links) {
                addLog(`  فحص: ${item.url.substring(0, 70)}...`);
                const status = await checkUrl(item.url);
                if (status === true || status === 'maybe') {
                    aliveCount++;
                    addLog(`  ✅ ${status === true ? 'شغال' : 'محتمل'}`);
                } else {
                    addLog(`  ❌ ميت`);
                }
                addResult(item.url, item.source, status);
            }

            // نفحص البقية
            for (const item of otherLinks.slice(0, 20)) {
                const status = await checkUrl(item.url);
                if (status === true) aliveCount++;
                addResult(item.url, item.source, status);
            }

            addLog(`\n✅ انتهى. ${aliveCount} رابط صالح من ${unique.length}`);
            goBtn.disabled = false;

            if (aliveCount === 0) {
                addLog('⚠️ لا توجد روابط شغالة. جرب:');
                addLog('  1. افتح الرابط في المتصفح واضغط F12');
                addLog('  2. اذهب لتبويب Network وشغل الفيديو');
                addLog('  3. ابحث عن aflm-eco2-akf.cdnz.quest');
            }
        }

        // Enter
        urlInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') extract();
        });

        console.log('✅ مستخرج MP4 المباشر جاهز.');
    </script>
</body>
</html>
