<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>محول Shadwo → MP4 - تلقائي</title>
</head>
<body style="background:#0a0a0f;color:#00e676;font-family:monospace;padding:20px;">
    <h2>🔄 محول روابط Shadwo التلقائي</h2>
    <p style="color:#888;">يعمل كل 20 دقيقة عبر cron-job.org</p>
    <div id="log" style="white-space:pre-wrap;word-break:break-all;"></div>

    <script>
        const FIREBASE_URL = 'https://mo-play-b0cb7-default-rtdb.firebaseio.com';
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://api.codetabs.com/v1/proxy?quest=',
        ];

        const logDiv = document.getElementById('log');

        function log(msg) {
            const time = new Date().toLocaleTimeString('ar-SA');
            logDiv.innerHTML += `<div>${time} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function fetchPage(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 10000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        signal: ctrl.signal,
                        headers: { 'User-Agent': 'Mozilla/5.0' }
                    });
                    clearTimeout(t);
                    if (res.ok) return await res.text();
                } catch(e) {}
            }
            return null;
        }

        async function extractMp4(shadwoUrl) {
            const mp4Url = shadwoUrl.replace(/serv=\d+/, 'serv=2');
            const html = await fetchPage(mp4Url);
            if (!html) return null;
            const iframeMatch = html.match(/<iframe[^>]+src=["']([^"']+)["']/i);
            if (!iframeMatch) return null;
            const iframeHtml = await fetchPage(iframeMatch[1]);
            if (!iframeHtml) return null;
            const aflmMatch = iframeHtml.match(/https?:\/\/aflm[^"'\s]*cdnz\.quest\/[a-z0-9]+\/v\.mp4/i);
            if (aflmMatch) return aflmMatch[0];
            const nestedMatch = iframeHtml.match(/<iframe[^>]+src=["']([^"']+)["']/i);
            if (nestedMatch) {
                const nestedHtml = await fetchPage(nestedMatch[1]);
                if (nestedHtml) {
                    const nestedAflm = nestedHtml.match(/https?:\/\/aflm[^"'\s]*cdnz\.quest\/[a-z0-9]+\/v\.mp4/i);
                    if (nestedAflm) return nestedAflm[0];
                }
            }
            return null;
        }

        async function updateFirebase(id, episodes) {
            try {
                const res = await fetch(FIREBASE_URL + '/series/' + id + '/episodes.json', {
                    method: 'PUT',
                    body: JSON.stringify(episodes),
                    headers: { 'Content-Type': 'application/json' }
                });
                return res.ok;
            } catch(e) {
                return false;
            }
        }

        (async function main() {
            log('🚀 ========== بدء دورة جديدة ==========');

            try {
                const res = await fetch(FIREBASE_URL + '/series.json');
                if (!res.ok) {
                    log('❌ فشل الاتصال بـ Firebase');
                    return;
                }

                const data = await res.json();
                let totalChecked = 0;
                let totalConverted = 0;
                let totalFailed = 0;

                for (const seriesId in data) {
                    const series = data[seriesId];
                    if (!series.episodes || !Array.isArray(series.episodes)) continue;

                    let changed = false;
                    const episodes = JSON.parse(JSON.stringify(series.episodes));

                    for (let i = 0; i < episodes.length; i++) {
                        const ep = episodes[i];
                        const fields = ['link1', 'link2', 'link3'];

                        for (const field of fields) {
                            const link = ep[field] || '';

                            // ===== فقط روابط shadwo.pro =====
                            if (!link.includes('shadwo.pro')) continue;

                            totalChecked++;
                            log(`🔍 [${series.title || seriesId}] حلقة ${i+1} - ${field}`);
                            log(`   📄 ${link.substring(0, 70)}...`);

                            const mp4 = await extractMp4(link);

                            if (mp4) {
                                episodes[i][field] = mp4;
                                changed = true;
                                totalConverted++;
                                log(`   ✅ ${mp4.substring(0, 70)}...`);
                            } else {
                                totalFailed++;
                                log(`   ❌ فشل الاستخراج`);
                            }

                            // تأخير لتجنب الحظر
                            await new Promise(r => setTimeout(r, 2000));
                        }
                    }

                    if (changed) {
                        const updated = await updateFirebase(seriesId, episodes);
                        if (updated) {
                            log(`💾 تم حفظ: ${series.title || seriesId}`);
                        } else {
                            log(`❌ فشل حفظ: ${series.title || seriesId}`);
                        }
                    }
                }

                log('');
                log(`📊 ========== إحصائيات ==========`);
                log(`🔍 تم فحص: ${totalChecked} رابط`);
                log(`✅ تم تحويل: ${totalConverted} رابط`);
                log(`❌ فشل: ${totalFailed} رابط`);
                log(`⏰ الوقت: ${new Date().toLocaleString('ar-SA')}`);
                log('✅ ========== انتهت الدورة ==========');

            } catch(e) {
                log(`❌ خطأ: ${e.message}`);
            }
        })();
    </script>
</body>
</html>
