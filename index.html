<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>البصري تيفي - مسلسلات وأفلام</title>
  <link rel="icon" type="image/jpg" href="https://up6.cc/2026/04/177672181699171.jpg" />
  <meta name="description" content="البصري تي في منصة لمشاهدة أحدث المسلسلات والأفلام العربية والتركية والأجنبية بجودة عالية." />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-main: #141414;
      --bg-card: #1f1f1f;
      --bg-hover: #2a2a2a;
      --primary: #e50914;
      --primary-hover: #f40612;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      --border-color: rgba(255, 255, 255, 0.08);
      --sidebar-width: 260px;
      --topbar-height: 60px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════ */
    /* الشريط العلوي */
    /* ═══════════════════════════════════════════ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: var(--topbar-height);
      background: linear-gradient(to bottom, rgba(20, 20, 20, 0.95) 0%, rgba(20, 20, 20, 0.8) 100%);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 20px;
      transition: background 0.3s;
    }

    .topbar.scrolled {
      background: rgba(20, 20, 20, 0.98);
    }

    .menu-toggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      margin-left: 15px;
      display: none;
      padding: 5px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .logo span {
      color: #fff;
      font-weight: 400;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-right: auto;
    }

    .search-toggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
      transition: 0.2s;
    }

    .search-toggle:hover {
      color: var(--primary);
    }

    /* شريط البحث المنسدل */
    .search-dropdown {
      position: absolute;
      top: var(--topbar-height);
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(15px);
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: none;
      z-index: 999;
      animation: slideDown 0.3s ease;
    }

    .search-dropdown.active {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .search-input-wrapper {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 14px 50px 14px 20px;
      border-radius: 4px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      transition: 0.3s;
    }

    .search-input:focus {
      background: rgba(0,0,0,0.8);
      border-color: #fff;
      outline: none;
    }

    .search-icon-abs {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      font-size: 20px;
    }

    .voice-btn {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .voice-btn:hover { color: var(--primary); }
    .voice-btn.listening { color: var(--primary); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .search-results {
      max-width: 600px;
      margin: 10px auto 0;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .search-results.show {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-result-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .search-result-item img {
      width: 45px;
      height: 65px;
      object-fit: cover;
      border-radius: 4px;
    }

    .search-result-info h4 {
      font-size: 15px;
      margin-bottom: 3px;
    }

    .search-result-info span {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ═══════════════════════════════════════════ */
    /* القائمة الجانبية */
    /* ═══════════════════════════════════════════ */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 998;
      display: none;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: calc(-1 * var(--sidebar-width));
      width: var(--sidebar-width);
      height: 100%;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(20px);
      z-index: 999;
      overflow-y: auto;
      transition: right 0.3s ease;
      border-left: 1px solid rgba(255,255,255,0.05);
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar-header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }

    .sidebar-logo {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
    }

    .sidebar-logo span {
      color: #fff;
    }

    .sidebar-nav {
      padding: 10px 0;
    }

    .sidebar-title {
      padding: 15px 20px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: #ccc;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
      border-right: 3px solid transparent;
      font-weight: 500;
    }

    .sidebar-item:hover {
      background: rgba(255,255,255,0.05);
      color: #fff;
    }

    .sidebar-item.active {
      background: rgba(229, 9, 20, 0.15);
      color: #fff;
      border-right-color: var(--primary);
    }

    .sidebar-item .icon {
      width: 24px;
      text-align: center;
      font-size: 16px;
    }

    /* ═══════════════════════════════════════════ */
    /* المحتوى الرئيسي */
    /* ═══════════════════════════════════════════ */
    .main-content {
      padding-top: var(--topbar-height);
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════ */
    /* السلايدر - Netflix Style */
    /* ═══════════════════════════════════════════ */
    .hero-section {
      position: relative;
      width: 100%;
      height: 85vh;
      min-height: 500px;
      max-height: 900px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    .hero-slide.active {
      opacity: 1;
      visibility: visible;
    }

    .hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        #141414 0%,
        rgba(20, 20, 20, 0.9) 8%,
        rgba(20, 20, 20, 0.7) 20%,
        rgba(20, 20, 20, 0.3) 50%,
        rgba(20, 20, 20, 0.1) 70%,
        transparent 100%
      );
      z-index: 2;
    }

    .hero-vignette-left {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to left,
        transparent 50%,
        rgba(20, 20, 20, 0.6) 100%
      );
      z-index: 2;
    }

    .hero-video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
      background: #000;
    }

    .hero-video-container.playing {
      display: block;
    }

    .hero-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      position: absolute;
      bottom: 25%;
      right: 60px;
      z-index: 5;
      max-width: 550px;
    }

    .hero-title {
      font-size: 60px;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 2px 2px 20px rgba(0,0,0,0.8);
      line-height: 1.1;
      color: #fff;
    }

    .hero-meta {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }

    .hero-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 700;
    }

    .hero-info {
      color: #ccc;
      font-size: 14px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 30px;
      border-radius: 4px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    .btn-play:hover {
      background: rgba(255,255,255,0.85);
    }

    .btn-more {
      background: rgba(109, 109, 110, 0.7);
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 4px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    .btn-more:hover {
      background: rgba(109, 109, 110, 0.4);
    }

    .btn-mute-hero {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.2s;
    }

    .btn-mute-hero:hover {
      border-color: #fff;
    }

    .hero-age {
      position: absolute;
      bottom: 25%;
      left: 0;
      background: rgba(51, 51, 51, 0.6);
      color: #fff;
      padding: 8px 35px 8px 15px;
      font-size: 15px;
      border-left: 3px solid #fff;
      z-index: 5;
    }

    /* نقاط التنقل */
    .slider-dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .slider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .slider-dot.active {
      background: var(--primary);
      width: 20px;
      border-radius: 4px;
    }

    /* ═══════════════════════════════════════════ */
    /* صفوف المسلسلات */
    /* ═══════════════════════════════════════════ */
    .content-section {
      padding: 0 40px 30px;
    }

    .section-header {
      margin-bottom: 15px;
    }

    .section-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #e5e5e5;
    }

    .row-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }

    .row-scroll::-webkit-scrollbar {
      height: 5px;
    }

    .row-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .row-scroll::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    .row-card {
      flex: 0 0 200px;
      background: var(--bg-card);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .row-card:hover {
      transform: scale(1.08);
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .row-card-img {
      aspect-ratio: 2/3;
      position: relative;
      background: #2a2a2a;
      overflow: hidden;
    }

    .row-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: 0.3s;
    }

    .row-card:hover .row-card-img img {
      transform: scale(1.1);
    }

    .row-card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: 0.3s;
    }

    .row-card:hover .row-card-overlay {
      opacity: 1;
    }

    .play-circle {
      width: 50px;
      height: 50px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }

    .row-card-info {
      padding: 10px 12px;
    }

    .row-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-card-meta {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .pagination-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      font-size: 14px;
    }

    .page-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .page-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ═══════════════════════════════════════════ */
    /* المشغل */
    /* ═══════════════════════════════════════════ */
    .player-section {
      display: none;
      padding: 80px 40px 30px;
      background: #000;
      min-height: 100vh;
    }

    .player-section.active {
      display: block;
    }

    .player-wrapper {
      max-width: 1100px;
      margin: 0 auto;
    }

    .player-frame {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #222;
    }

    .player-frame video,
    .player-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .player-title-section {
      margin: 20px 0;
    }

    .player-title-section h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .player-controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .btn-back {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      padding: 10px 25px;
      border-radius: 4px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-back:hover {
      background: var(--primary);
    }

    .btn-fullscreen {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      padding: 10px 25px;
      border-radius: 4px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-fullscreen:hover {
      background: rgba(255,255,255,0.2);
    }

    .episodes-section {
      margin-top: 30px;
    }

    .episodes-section h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .ep-card {
      background: #1f1f1f;
      border: 2px solid transparent;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
      font-size: 14px;
    }

    .ep-card:hover {
      background: #2a2a2a;
      border-color: rgba(255,255,255,0.2);
    }

    .ep-card.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .loading-state {
      text-align: center;
      padding: 50px;
      color: #888;
      font-size: 18px;
    }

    .error-state {
      text-align: center;
      padding: 50px;
      color: var(--primary);
      font-size: 18px;
    }

    /* ═══════════════════════════════════════════ */
    /* الجوال */
    /* ═══════════════════════════════════════════ */
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      
      .hero-section {
        height: 60vh;
        min-height: 400px;
      }

      .hero-content {
        right: 20px;
        bottom: 20%;
        max-width: 85%;
      }

      .hero-title {
        font-size: 32px;
      }

      .hero-actions {
        flex-wrap: wrap;
      }

      .btn-play {
        padding: 10px 20px;
        font-size: 16px;
      }

      .btn-more {
        padding: 10px 18px;
        font-size: 14px;
      }

      .content-section {
        padding: 0 15px 20px;
      }

      .row-card {
        flex: 0 0 140px;
      }

      .player-section {
        padding: 70px 15px 20px;
      }

      .player-title-section h1 {
        font-size: 22px;
      }

      .episodes-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 769px) {
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">البصري <span>تيفي</span></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="sidebar-title">الأقسام</div>
      <!-- تمتلئ ديناميكياً -->
    </nav>
  </aside>

  <!-- الشريط العلوي -->
  <header class="topbar" id="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="القائمة">☰</button>
    <a href="/" class="logo">البصري <span>تيفي</span></a>
    <div class="topbar-right">
      <button class="search-toggle" onclick="toggleSearch()" aria-label="بحث">🔍</button>
    </div>
  </header>

  <!-- شريط البحث المنسدل -->
  <div class="search-dropdown" id="searchDropdown">
    <div class="search-input-wrapper">
      <span class="search-icon-abs">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن مسلسلات، أفلام..." autocomplete="off" />
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceSearch()" title="بحث صوتي">🎤</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- المحتوى الرئيسي -->
  <main class="main-content" id="mainContent">
    <!-- السلايدر -->
    <section class="hero-section" id="heroSection"></section>

    <!-- شبكة المسلسلات -->
    <section class="content-section" id="contentSection">
      <div class="section-header">
        <h2 id="sectionTitle">المحتوى</h2>
      </div>
      <div class="row-scroll" id="contentGrid"></div>
      <div class="pagination-row" id="paginationRow"></div>
    </section>
  </main>

  <!-- المشغل -->
  <section class="player-section" id="playerSection">
    <div class="player-wrapper">
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-title-section">
        <h1 id="playerEpisodeTitle">جاري التحميل...</h1>
      </div>
      <div class="player-controls">
        <button class="btn-back" onclick="closePlayer()">↩ العودة</button>
        <button class="btn-fullscreen" onclick="triggerFullscreen()">⛶ ملء الشاشة</button>
      </div>
      <div class="episodes-section">
        <h3>الحلقات</h3>
        <div class="episodes-grid" id="episodesGrid"></div>
      </div>
    </div>
  </section>

  <script>
    const API = "https://series.albesriali03.workers.dev/";

    // الحالة
    let state = {
      sidebarOpen: false,
      searchOpen: false,
      playerOpen: false,
      currentCategory: null,
      currentCategoryUrl: '',
      currentSeries: [],
      currentEpisodes: [],
      currentEpisodeIndex: 0,
      currentSeriesTitle: '',
      currentSeriesImage: '',
      pagination: [],
      activeEpisodeUrl: ''
    };

    // بيانات السلايدر والبحث
    let sliderItems = [];
    let allSearchData = [];
    let currentSlideIndex = 0;
    let slideInterval = null;
    let isSliderMuted = true;
    let isTransitioning = false;

    // الأقسام الثابتة
    const CATEGORIES = [
      { name: "الرئيسية", icon: "🏠", searchKeys: ["مسلسلات ترك", "مسلسل ترك"] },
      { name: "مسلسلات تركية", icon: "🇹🇷", searchKeys: ["مسلسلات ترك", "مسلسل ترك", "تركي"] },
      { name: "مسلسلات عربية", icon: "🌍", searchKeys: ["مسلسلات عرب", "مسلسل عرب", "عربي", "مصر", "سوري"] },
      { name: "مسلسلات خليجية", icon: "🏝️", searchKeys: ["مسلسلات خليج", "مسلسل خليج", "خليجي", "كويت"] },
      { name: "مسلسلات أجنبية", icon: "🎬", searchKeys: ["مسلسلات اجنب", "مسلسل اجنب"] },
      { name: "أفلام أجنبية", icon: "🎥", searchKeys: ["افلام اجنب", "فيلم اجنب"] },
      { name: "مسلسلات كورية", icon: "🇰🇷", searchKeys: ["مسلسلات كور", "مسلسل كور", "كوري"] },
      { name: "مسلسلات آسيوية", icon: "🌏", searchKeys: ["مسلسلات اسيو", "مسلسل اسيو", "صيني", "يابان"] },
      { name: "أنمي وكرتون", icon: "🎌", searchKeys: ["انمي", "كرتون"] },
      { name: "مسلسلات إيرانية", icon: "🇮🇷", searchKeys: ["مسلسلات ايران", "مسلسل ايران", "فارسي"] },
      { name: "رمضان 2026 عربي", icon: "🌟", searchKeys: ["2026 عرب", "رمضان 2026"] },
      { name: "رمضان 2026 خليجي", icon: "⭐", searchKeys: ["2026 خليج"] },
    ];

    // عناصر DOM
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // ═══════════════════════════════
    // القائمة الجانبية
    // ═══════════════════════════════
    function toggleSidebar() {
      state.sidebarOpen = !state.sidebarOpen;
      $('#sidebar').classList.toggle('active', state.sidebarOpen);
      $('#sidebarOverlay').classList.toggle('active', state.sidebarOpen);
    }

    function closeSidebar() {
      state.sidebarOpen = false;
      $('#sidebar').classList.remove('active');
      $('#sidebarOverlay').classList.remove('active');
    }

    function buildSidebar(categories) {
      const nav = $('#sidebarNav');
      nav.innerHTML = `
        <div class="sidebar-title">الأقسام</div>
        ${categories.map((cat, i) => `
          <div class="sidebar-item ${i === 0 ? 'active' : ''}" data-index="${i}" onclick="selectCategory(${i}, '${encodeURIComponent(cat.url || '')}', '${escapeQuotes(cat.name)}')">
            <span class="icon">${cat.icon}</span>
            <span>${cat.name}</span>
          </div>
        `).join('')}
      `;
    }

    function selectCategory(index, encodedUrl, name) {
      closeSidebar();
      
      $$('.sidebar-item').forEach(item => item.classList.remove('active'));
      const items = $$('.sidebar-item');
      if (items[index]) items[index].classList.add('active');

      const url = decodeURIComponent(encodedUrl);
      state.currentCategory = { name, url };
      state.currentCategoryUrl = url;

      if (index === 0 || !url || url === 'undefined') {
        // الرئيسية
        loadMainContent();
      } else {
        loadSeries(url, name);
      }
    }

    // ═══════════════════════════════
    // البحث
    // ═══════════════════════════════
    function toggleSearch() {
      state.searchOpen = !state.searchOpen;
      $('#searchDropdown').classList.toggle('active', state.searchOpen);
      if (state.searchOpen) {
        setTimeout(() => $('#searchInput').focus(), 100);
      } else {
        $('#searchInput').value = '';
        $('#searchResults').classList.remove('show');
      }
    }

    function normalizeText(text) {
      return (text || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').toLowerCase().trim();
    }

    function findCategoryUrl(apiCategories, searchKeys) {
      for (const key of searchKeys) {
        const normalizedKey = normalizeText(key);
        const found = apiCategories.find(c => normalizeText(c.name).includes(normalizedKey));
        if (found) return found.url;
      }
      return '';
    }

    function escapeQuotes(str) {
      return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function isValidImage(url) {
      if (!url || url.trim() === '' || url.length < 15) return false;
      const badWords = ['logo', 'default', 'no-poster', 'noposter', 'empty', 'blank', 'no-image'];
      return !badWords.some(w => url.toLowerCase().includes(w));
    }

    function levenshteinSimilarity(a, b) {
      a = a.toLowerCase().trim();
      b = b.toLowerCase().trim();
      if (a === b) return 1;
      if (a.includes(b) || b.includes(a)) return 0.9;
      
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          matrix[i][j] = (b.charAt(i-1) === a.charAt(j-1))
            ? matrix[i-1][j-1]
            : Math.min(matrix[i-1][j-1] + 1, matrix[i][j-1] + 1, matrix[i-1][j] + 1);
        }
      }
      
      const maxLen = Math.max(a.length, b.length);
      return maxLen === 0 ? 1 : (maxLen - matrix[b.length][a.length]) / maxLen;
    }

    function performSearch(query) {
      query = query.trim();
      if (query.length < 2) {
        $('#searchResults').classList.remove('show');
        return;
      }

      const results = allSearchData
        .filter(item => item.title && isValidImage(item.image))
        .map(item => ({
          ...item,
          score: levenshteinSimilarity(item.title, query)
        }))
        .filter(item => item.score > 0.3)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

      if (!results.length) {
        $('#searchResults').innerHTML = '<div style="text-align:center; padding:20px; color:#888;">لا توجد نتائج</div>';
        $('#searchResults').classList.add('show');
        return;
      }

      $('#searchResults').innerHTML = results.map(item => `
        <div class="search-result-item" onclick="openFromSearch('${encodeURIComponent(item.url)}', '${escapeQuotes(item.title)}', '${encodeURIComponent(item.image)}')">
          <img src="${item.image}" alt="${item.title}" onerror="this.style.display='none'" loading="lazy" />
          <div class="search-result-info">
            <h4>${item.title}</h4>
            <span>${item.category || ''} • ${item.episodes || ''}</span>
          </div>
        </div>
      `).join('');
      $('#searchResults').classList.add('show');
    }

    window.openFromSearch = function(encodedUrl, title, encodedImage) {
      toggleSearch();
      openEpisodes(
        decodeURIComponent(encodedUrl),
        decodeURIComponent(title),
        decodeURIComponent(encodedImage)
      );
    };

    // بحث صوتي
    function toggleVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('المتصفح لا يدعم البحث الصوتي');
        return;
      }

      const voiceBtn = $('#voiceBtn');
      if (voiceBtn.classList.contains('listening')) {
        voiceBtn.classList.remove('listening');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.interimResults = false;

      voiceBtn.classList.add('listening');

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        $('#searchInput').value = text;
        performSearch(text);
        voiceBtn.classList.remove('listening');
      };

      recognition.onerror = function() {
        voiceBtn.classList.remove('listening');
      };

      recognition.onend = function() {
        voiceBtn.classList.remove('listening');
      };

      recognition.start();
    }

    // ═══════════════════════════════
    // السلايدر
    // ═══════════════════════════════
    function stopSlider() {
      if (slideInterval) clearInterval(slideInterval);
    }

    function buildHeroSlider(items) {
      stopSlider();
      sliderItems = items;
      currentSlideIndex = 0;

      if (!items.length) {
        $('#heroSection').style.display = 'none';
        return;
      }

      $('#heroSection').style.display = 'block';
      $('#heroSection').innerHTML = items.map((item, i) => `
        <div class="hero-slide ${i === 0 ? 'active' : ''}" data-index="${i}" data-id="${item.id}" data-played="false">
          <img src="${item.image}" class="hero-bg" loading="${i === 0 ? 'eager' : 'lazy'}" onerror="this.style.opacity='0'" />
          <div class="hero-vignette"></div>
          <div class="hero-vignette-left"></div>
          <div class="hero-video-container" id="hero-vid-${i}">
            <video id="hero-video-${i}" playsinline muted loop></video>
          </div>
          <div class="hero-content">
            <h1 class="hero-title">${item.title}</h1>
            <div class="hero-meta">
              <span class="hero-badge">جديد</span>
              <span class="hero-info">${item.episodes || ''}</span>
            </div>
            <div class="hero-actions">
              <button class="btn-play" onclick="event.stopPropagation(); openFromSlider('${item.id}')">
                ▶ تشغيل
              </button>
              <button class="btn-more" onclick="event.stopPropagation(); openFromSlider('${item.id}')">
                ℹ المزيد
              </button>
              <button class="btn-mute-hero" onclick="event.stopPropagation(); toggleSliderMute()" title="كتم الصوت">
                ${isSliderMuted ? '🔇' : '🔊'}
              </button>
            </div>
          </div>
        </div>
      `).join('') + `
        <div class="slider-dots">
          ${items.map((_, i) => `
            <div class="slider-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>
          `).join('')}
        </div>
      `;

      // بدء التريلر الأول بعد 2 ثانية
      setTimeout(() => {
        const firstSlide = $('#heroSection').querySelector('.hero-slide.active');
        if (firstSlide) playHeroTrailer(firstSlide);
      }, 2000);

      startSliderCycle();
    }

    function playHeroTrailer(slide) {
      if (slide.dataset.played === 'true') return;

      const index = parseInt(slide.dataset.index);
      const item = sliderItems[index];
      if (!item.trailer) return;

      const video = document.getElementById('hero-video-' + index);
      const container = document.getElementById('hero-vid-' + index);
      const bg = slide.querySelector('.hero-bg');

      if (!video || !container) return;

      if (bg) bg.style.opacity = '0.4';
      container.classList.add('playing');
      container.style.display = 'block';

      video.src = item.trailer;
      video.muted = isSliderMuted;
      video.setAttribute('playsinline', '');
      video.play().catch(() => {
        if (bg) bg.style.opacity = '1';
        container.style.display = 'none';
        container.classList.remove('playing');
      });

      slide.dataset.played = 'true';
    }

    function nextSlide() {
      const slides = $$('.hero-slide');
      if (!slides.length) return;

      const current = $('#heroSection').querySelector('.hero-slide.active');
      if (current) {
        const idx = parseInt(current.dataset.index);
        const video = document.getElementById('hero-video-' + idx);
        const container = document.getElementById('hero-vid-' + idx);
        const bg = current.querySelector('.hero-bg');

        if (video) { video.pause(); video.src = ''; }
        if (container) { container.style.display = 'none'; container.classList.remove('playing'); }
        if (bg) bg.style.opacity = '1';
        current.classList.remove('active');
      }

      currentSlideIndex = (currentSlideIndex + 1) % slides.length;
      if (slides[currentSlideIndex]) {
        slides[currentSlideIndex].classList.add('active');
        updateSliderDots();

        setTimeout(() => {
          const newSlide = $('#heroSection').querySelector('.hero-slide.active');
          if (newSlide && newSlide.dataset.played === 'false') {
            playHeroTrailer(newSlide);
          }
        }, 2000);
      }
    }

    function goToSlide(index) {
      stopSlider();
      const slides = $$('.hero-slide');
      const current = $('#heroSection').querySelector('.hero-slide.active');

      if (current) {
        const idx = parseInt(current.dataset.index);
        const video = document.getElementById('hero-video-' + idx);
        const container = document.getElementById('hero-vid-' + idx);
        const bg = current.querySelector('.hero-bg');
        if (video) { video.pause(); video.src = ''; }
        if (container) { container.style.display = 'none'; container.classList.remove('playing'); }
        if (bg) bg.style.opacity = '1';
        current.classList.remove('active');
      }

      currentSlideIndex = index;
      if (slides[currentSlideIndex]) {
        slides[currentSlideIndex].classList.add('active');
        slides[currentSlideIndex].dataset.played = 'false';
        updateSliderDots();

        setTimeout(() => playHeroTrailer(slides[currentSlideIndex]), 1500);
      }

      startSliderCycle();
    }

    function updateSliderDots() {
      $$('.slider-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlideIndex);
      });
    }

    function startSliderCycle() {
      stopSlider();
      slideInterval = setInterval(() => {
        if (!isTransitioning) {
          isTransitioning = true;
          nextSlide();
          setTimeout(() => { isTransitioning = false; }, 1500);
        }
      }, 15000);
    }

    window.toggleSliderMute = function() {
      isSliderMuted = !isSliderMuted;
      const videos = $$('.hero-video-container video');
      videos.forEach(v => { v.muted = isSliderMuted; });

      const muteBtn = $('#heroSection').querySelector('.btn-mute-hero');
      if (muteBtn) muteBtn.textContent = isSliderMuted ? '🔇' : '🔊';
    };

    window.openFromSlider = function(id) {
      const item = sliderItems.find(x => x.id === id);
      if (item) {
        openEpisodes(item.url, item.title, item.image);
      }
    };

    // ═══════════════════════════════
    // تحميل البيانات
    // ═══════════════════════════════
    async function apiGet(url) {
      const res = await fetch(url);
      const data = await res.json();
      if (!data.status) throw new Error(data.error || 'فشل التحميل');
      return data;
    }

    async function initializeApp() {
      try {
        showLoader();

        // تحميل الأقسام من API
        const data = await apiGet(`${API}/?action=categories`);
        const apiCategories = data.data || [];

        // بناء الأقسام مع الروابط
        const categories = CATEGORIES.map(cat => ({
          ...cat,
          url: findCategoryUrl(apiCategories, cat.searchKeys)
        }));

        buildSidebar(categories);

        // تحميل السلايدر
        await loadSliderContent(apiCategories);

        // تحميل بيانات البحث
        loadSearchData(apiCategories);

        // تحميل المحتوى الرئيسي
        await loadMainContent(apiCategories);

      } catch (e) {
        showError('تعذر تحميل البيانات: ' + e.message);
      }
    }

    async function loadSliderContent(apiCategories) {
      const priorityCats = ['مسلسلات ترك', 'مسلسلات عرب', 'مسلسلات اجنب'];
      let items = [];

      for (const key of priorityCats) {
        const url = findCategoryUrl(apiCategories, [key]);
        if (!url || url === 'undefined') continue;

        try {
          const data = await apiGet(`${API}/?action=series&url=${encodeURIComponent(url)}`);
          const valid = (data.data || [])
            .filter(item => isValidImage(item.image))
            .slice(0, 3);
          items = items.concat(valid);
        } catch(e) {}
      }

      sliderItems = items.slice(0, 7);
      buildHeroSlider(sliderItems);
    }

    async function loadSearchData(apiCategories) {
      const allItems = [];
      for (const cat of CATEGORIES) {
        const url = findCategoryUrl(apiCategories, cat.searchKeys);
        if (!url || url === 'undefined') continue;

        try {
          const data = await apiGet(`${API}/?action=series&url=${encodeURIComponent(url)}`);
          const items = (data.data || [])
            .filter(item => isValidImage(item.image))
            .map(item => ({ ...item, category: cat.name }));
          allItems.push(...items);
        } catch(e) {}
      }
      allSearchData = [...new Map(allItems.map(item => [item.id, item])).values()];
    }

    async function loadMainContent(apiCategories) {
      // تحميل أول قسم متاح
      if (!apiCategories) {
        try {
          const data = await apiGet(`${API}/?action=categories`);
          apiCategories = data.data || [];
        } catch(e) {
          showError('تعذر تحميل المحتوى');
          return;
        }
      }

      const turkishUrl = findCategoryUrl(apiCategories, ['مسلسلات ترك', 'مسلسل ترك', 'تركي']);
      if (turkishUrl && turkishUrl !== 'undefined') {
        await loadSeries(turkishUrl, 'مسلسلات تركية');
      } else {
        // تحميل أول قسم متاح
        for (const cat of CATEGORIES) {
          const url = findCategoryUrl(apiCategories, cat.searchKeys);
          if (url && url !== 'undefined') {
            await loadSeries(url, cat.name);
            return;
          }
        }
      }
    }

    async function loadSeries(url, name) {
      try {
        showLoader();
        hidePlayer();

        state.currentCategory = { name, url };
        state.currentCategoryUrl = url;
        state.currentSeries = [];

        const data = await apiGet(`${API}/?action=series&url=${encodeURIComponent(url)}`);
        const series = (data.data || []).filter(item => isValidImage(item.image));
        state.currentSeries = series;
        state.pagination = data.pagination || [];

        $('#sectionTitle').textContent = name;
        renderContentGrid(series, data.pagination || []);
        $('#heroSection').style.display = 'block';

      } catch(e) {
        showError('تعذر تحميل المحتوى: ' + e.message);
      }
    }

    function renderContentGrid(series, pagination) {
      const grid = $('#contentGrid');
      
      if (!series.length) {
        grid.innerHTML = '<div class="loading-state">لا توجد محتويات حالياً</div>';
        $('#paginationRow').innerHTML = '';
        return;
      }

      grid.innerHTML = series.map(item => `
        <div class="row-card" onclick="openEpisodes('${encodeURIComponent(item.url)}', '${escapeQuotes(item.title)}', '${encodeURIComponent(item.image)}')">
          <div class="row-card-img">
            <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.parentElement.parentElement.style.display='none'" />
            <div class="row-card-overlay">
              <div class="play-circle">▶</div>
            </div>
          </div>
          <div class="row-card-info">
            <div class="row-card-title">${item.title}</div>
            <div class="row-card-meta">${item.episodes || ''}</div>
          </div>
        </div>
      `).join('');

      // الترقيم
      const pages = pagination.filter(p => /^\d+$/.test(String(p.label || '')));
      $('#paginationRow').innerHTML = pages.map(p => `
        <button class="page-btn" onclick="loadSeries('${encodeURIComponent(p.url)}', '${escapeQuotes(state.currentCategory?.name || '')}')">
          ${p.label}
        </button>
      `).join('');

      window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    async function openEpisodes(url, title, image) {
  try {
    showLoader();
    hidePlayer();

    state.currentSeriesTitle = title;
    state.currentSeriesImage = image;
    state.currentEpisodes = [];

    // تأكد من أن الرابط صحيح ومشفر مرة واحدة فقط
    let cleanUrl = decodeURIComponent(url);
    // لو الرابط ما فيه http نضيفه
    if (!cleanUrl.startsWith('http')) {
      cleanUrl = 'https://' + cleanUrl;
    }
    
    console.log('جاري تحميل الحلقات من:', cleanUrl);
    
    const apiUrl = `${API}/?action=episodes&url=${encodeURIComponent(cleanUrl)}`;
    console.log('API URL:', apiUrl);
    
    const response = await fetch(apiUrl);
    const data = await response.json();
    
    console.log('استجابة API:', data);
    
    if (!data.status) {
      throw new Error(data.error || 'فشل تحميل الحلقات');
    }
    
    const episodes = (data.data || []).map(ep => ({
      ...ep,
      displayName: normalizeEpisodeName(ep.name)
    }));

    state.currentEpisodes = episodes;

    $('#sectionTitle').textContent = title;
    renderEpisodesAsCards(episodes, image);
    $('#heroSection').style.display = 'none';

  } catch(e) {
    console.error('خطأ في تحميل الحلقات:', e);
    showError('تعذر تحميل الحلقات: ' + e.message);
  }
}

async function playEpisode(index) {
  try {
    const ep = state.currentEpisodes[index];
    if (!ep) return;

    state.currentEpisodeIndex = index;
    state.activeEpisodeUrl = ep.url;

    showPlayer();

    $('#playerEpisodeTitle').textContent = ep.displayName;
    $('#playerFrame').innerHTML = '<div class="loading-state">جاري تحميل المشغل...</div>';

    // تنظيف الرابط
    let cleanUrl = decodeURIComponent(ep.url);
    if (!cleanUrl.startsWith('http')) {
      cleanUrl = 'https://' + cleanUrl;
    }
    
    console.log('جاري تشغيل:', cleanUrl);
    
    const apiUrl = `${API}/?action=play&url=${encodeURIComponent(cleanUrl)}`;
    console.log('Play API URL:', apiUrl);
    
    const response = await fetch(apiUrl);
    const data = await response.json();
    
    console.log('استجابة المشغل:', data);
    
    if (!data.status) {
      throw new Error(data.error || 'السيرفر غير متاح');
    }
    
    const streamUrl = data.player_url || (data.streams && data.streams[0]?.url);

    if (!streamUrl) throw new Error('السيرفر غير متاح حالياً');

    const isMp4 = streamUrl.toLowerCase().includes('.mp4');
    if (isMp4) {
      $('#playerFrame').innerHTML = `<video controls playsinline autoplay src="${streamUrl}" style="width:100%;height:100%;"></video>`;
    } else {
      $('#playerFrame').innerHTML = `<iframe src="${streamUrl}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
    }

    renderPlayerEpisodes(state.currentEpisodes, index);
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch(e) {
    console.error('خطأ في تشغيل الحلقة:', e);
    $('#playerFrame').innerHTML = `<div class="error-state">⚠️ ${e.message}</div>`;
  }
}

    function normalizeEpisodeName(name) {
      const text = String(name || '').trim();
      const patterns = [/ep\s*#?\s*(\d+)/i, /episode\s*#?\s*(\d+)/i, /الحلقة\s*(\d+)/i, /^(\d+)$/];
      for (const p of patterns) {
        const m = text.match(p);
        if (m && m[1]) {
          const n = parseInt(m[1], 10);
          const arNums = ["", "الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة", "التاسعة", "العاشرة",
            "الحادية عشر", "الثانية عشر", "الثالثة عشر", "الرابعة عشر", "الخامسة عشر"];
          if (n <= 15) return `الحلقة ${arNums[n]}`;
          return `الحلقة ${n}`;
        }
      }
      return text;
    }

    function renderEpisodesAsCards(episodes, image) {
      const grid = $('#contentGrid');
      grid.innerHTML = episodes.map((ep, i) => `
        <div class="row-card" onclick="playEpisode(${i})">
          <div class="row-card-img">
            <img src="${ep.series_image || image}" alt="${ep.displayName}" loading="lazy" onerror="this.style.background='#1f1f1f'" />
            <div class="row-card-overlay">
              <div class="play-circle">▶</div>
            </div>
          </div>
          <div class="row-card-info">
            <div class="row-card-title">${ep.displayName}</div>
          </div>
        </div>
      `).join('');
      $('#paginationRow').innerHTML = '';
    }

    async function playEpisode(index) {
      try {
        const ep = state.currentEpisodes[index];
        if (!ep) return;

        state.currentEpisodeIndex = index;
        state.activeEpisodeUrl = ep.url;

        showPlayer();

        $('#playerEpisodeTitle').textContent = ep.displayName;
        $('#playerFrame').innerHTML = '<div class="loading-state">جاري تحميل المشغل...</div>';

        const data = await apiGet(`${API}/?action=play&url=${encodeURIComponent(ep.url)}`);
        const streamUrl = data.player_url || (data.streams && data.streams[0]?.url);

        if (!streamUrl) throw new Error('السيرفر غير متاح');

        const isMp4 = streamUrl.toLowerCase().includes('.mp4');
        if (isMp4) {
          $('#playerFrame').innerHTML = `<video controls playsinline autoplay src="${streamUrl}" style="width:100%;height:100%;"></video>`;
        } else {
          $('#playerFrame').innerHTML = `<iframe src="${streamUrl}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
        }

        // عرض الحلقات في المشغل
        renderPlayerEpisodes(state.currentEpisodes, index);
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch(e) {
        $('#playerFrame').innerHTML = `<div class="error-state">${e.message}</div>`;
      }
    }

    function renderPlayerEpisodes(episodes, activeIndex) {
      $('#episodesGrid').innerHTML = episodes.map((ep, i) => `
        <div class="ep-card ${i === activeIndex ? 'active' : ''}" onclick="playEpisode(${i})">
          ${ep.displayName}
        </div>
      `).join('');
    }

    function showPlayer() {
      state.playerOpen = true;
      $('#playerSection').classList.add('active');
      $('#mainContent').style.display = 'none';
    }

    function hidePlayer() {
      state.playerOpen = false;
      $('#playerSection').classList.remove('active');
      $('#mainContent').style.display = 'block';
      $('#playerFrame').innerHTML = '';
    }

    function closePlayer() {
      hidePlayer();
      if (state.currentEpisodes.length > 0) {
        renderEpisodesAsCards(state.currentEpisodes, state.currentSeriesImage);
        $('#sectionTitle').textContent = state.currentSeriesTitle;
      } else if (state.currentSeries.length > 0) {
        renderContentGrid(state.currentSeries, state.pagination);
        $('#sectionTitle').textContent = state.currentCategory?.name || '';
      }
      $('#heroSection').style.display = state.currentEpisodes.length > 0 ? 'none' : 'block';
    }

    function triggerFullscreen() {
      const elem = $('#playerFrame').querySelector('iframe') || 
                   $('#playerFrame').querySelector('video') || 
                   $('#playerFrame');
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    // ═══════════════════════════════
    // المساعدة
    // ═══════════════════════════════
    function showLoader() {
      $('#contentGrid').innerHTML = '<div class="loading-state">⏳ جاري التحميل...</div>';
      $('#paginationRow').innerHTML = '';
    }

    function showError(msg) {
      $('#contentGrid').innerHTML = `<div class="error-state">⚠️ ${msg}</div>`;
      $('#paginationRow').innerHTML = '';
    }

    // ═══════════════════════════════
    // الأحداث
    // ═══════════════════════════════
    $('#searchInput').addEventListener('input', function(e) {
      performSearch(e.target.value);
    });

    $('#searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const query = this.value.trim();
        if (query.length >= 2) {
          const results = allSearchData
            .filter(item => item.title && isValidImage(item.image))
            .map(item => ({ ...item, score: levenshteinSimilarity(item.title, query) }))
            .filter(item => item.score > 0.5)
            .sort((a, b) => b.score - a.score);

          if (results.length > 0) {
            toggleSearch();
            openEpisodes(results[0].url, results[0].title, results[0].image);
          }
        }
      }
    });

    document.addEventListener('click', function(e) {
      if (state.searchOpen && !e.target.closest('.search-dropdown') && !e.target.closest('.search-toggle')) {
        toggleSearch();
      }
    });

    window.addEventListener('scroll', function() {
      const topbar = $('#topbar');
      if (window.scrollY > 50) {
        topbar.classList.add('scrolled');
      } else {
        topbar.classList.remove('scrolled');
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || 
          (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || 
          (e.ctrlKey && e.key.toUpperCase() === 'U')) {
        e.preventDefault();
      }
    });

    // بدء التطبيق
    window.onload = initializeApp;
  </script>
</body>
</html>
