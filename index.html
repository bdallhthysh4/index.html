<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا - جاري تحضير الرابط</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }
        .header-title { font-size: 24px; margin-bottom: 10px; color: #fff; }
        .status-text { color: #aaa; font-size: 14px; margin-bottom: 20px; }

        /* أماكن الإعلانات */
        .ad-banner {
            background: #1a1a1a;
            border: 1px solid #333;
            min-height: 250px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .ad-banner::before {
            content: "إعلان مروج";
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 10px;
            color: #444;
        }

        .timer-section {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e74c3c;
            margin: 20px 0;
        }
        #seconds { font-weight: bold; color: #e74c3c; font-size: 22px; }

        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: none; /* مخفي حتى ينتهي العداد */
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h1 class="header-title">حكايتنا - انتظر ثواني</h1>
    <p class="status-text">يتم الآن فحص الرابط الآمن وتجهيز السيرفر...</p>

    <div class="ad-banner">
        <p style="color:#333">Ad Space 1</p>
    </div>

    <div class="timer-section" id="timer-box">
        جاري تجهيز المشغل خلال: <br>
        <span id="seconds">15</span> ثانية
    </div>

    <button id="go-btn" class="btn" onclick="goToLink()">اضغط هنا للمشاهدة الآن</button>

    <div class="ad-banner">
        <p style="color:#333">Ad Space 2</p>
    </div>
</div>

<script type="text/javascript">
// <![CDATA[
    // 1. إعداد العداد
    let timeLeft = 15; 
    const timerText = document.getElementById('seconds');
    const timerBox = document.getElementById('timer-box');
    const btn = document.getElementById('go-btn');

    const interval = setInterval(() => {
        timeLeft--;
        timerText.innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(interval);
            timerBox.style.display = 'none';
            btn.style.display = 'block';
        }
    }, 1000);

    // 2. وظيفة الزر (توجيه للموقع الأصلي)
    function goToLink() {
        window.location.href = "https://www.hikaytna.my/"; 
    }

    // 3. سكريبت الإعلان المنبثق (الذي طلبته)
    // يعمل مرة واحدة فقط عند الضغط في أي مكان لضمان الربح
    let adExecuted = false;
    document.addEventListener('click', function() {
        if (!adExecuted) {
            var s = document.createElement('script');
            s.src = 'https://al5sm.com/tag.min.js';
            s.dataset.zone = '10943622';
            document.head.appendChild(s);
            adExecuted = true;
            console.log("Ad script loaded once.");
        }
    });
// ]]>
</script>

</body>
</html>
