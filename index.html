<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1"/>
    <title>محول Shadwo → MP4 - تلقائي</title>
    <style>
        :root { --bg: #0a0a0f; --green: #00e676; --red: #ff3d3d; --orange: #ff9100; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); font-family: 'Segoe UI', monospace;
            color: #ccc; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: var(--green); text-align: center; font-size: 1.4em; }
        .sub { text-align: center; color: #666; font-size: 0.8em; margin-bottom: 16px; }

        .stats {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
        }
        .stat {
            background: #111; border: 1px solid #222; border-radius: 10px;
            padding: 12px 18px; text-align: center; flex: 1; min-width: 80px;
        }
        .stat .num { font-size: 1.8em; font-weight: 800; }
        .stat .num.g { color: var(--green); }
        .stat .num.r { color: var(--red); }
        .stat .num.o { color: var(--orange); }
        .stat .lbl { font-size: 0.7em; color: #666; margin-top: 4px; }

        .log-box {
            background: #050510; border: 1px solid #1a1a2a; border-radius: 10px;
            padding: 14px; font-family: 'Consolas', monospace; font-size: 0.72em;
            color: #0f0; max-height: 500px; overflow-y: auto;
            white-space: pre-wrap; word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 محول Shadwo → MP4 التلقائي</h1>
        <p class="sub">يعمل كل 20 دقيقة عبر cron-job.org | فقط روابط shadwo.pro</p>

        <div class="stats">
            <div class="stat"><div class="num o" id="totalChecked">0</div><div class="lbl">🔍 تم فحص</div></div>
            <div class="stat"><div class="num g" id="totalConverted">0</div><div class="lbl">✅ تم تحويل</div></div>
            <div class="stat"><div class="num r" id="totalFailed">0</div><div class="lbl">❌ فشل</div></div>
        </div>

        <div class="log-box" id="logBox"></div>
    </div>

    <script>
        const FIREBASE_URL = 'https://mo-play-b0cb7-default-rtdb.firebaseio.com';
        const PROXIES = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://api.codetabs.com/v1/proxy?quest=",
        ];

        const logBox = document.getElementById('logBox');
        const totalCheckedEl = document.getElementById('totalChecked');
        const totalConvertedEl = document.getElementById('totalConverted');
        const totalFailedEl = document.getElementById('totalFailed');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString('ar-SA');
            logBox.textContent += `${time} - ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ============ نفس دوال الكود الأصلي ============
        async function fetchPage(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 10000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept': '*/*' },
                        signal: ctrl.signal
                    });
                    clearTimeout(t);
                    if (res.ok) return await res.text();
                } catch(e) { continue; }
            }
            throw new Error('فشل الاتصال');
        }

        function extractIframes(html) {
            const r = /<iframe[^>]+src=["']([^"']+)["']/gi;
            const out = [];
            let m;
            while ((m = r.exec(html))) out.push(m[1]);
            return [...new Set(out)];
        }

        function extractAflmUrls(html) {
            const found = [];
            const patterns = [
                /https?:\/\/aflm[^\s"'<>]*cdnz\.quest\/[a-z0-9]+\/v\.mp4/gi,
            ];
            for (const p of patterns) {
                let m;
                while ((m = p.exec(html))) {
                    let u = m[0].replace(/["'<>\\]+$/, '').replace(/&amp;/g, '&');
                    if (!found.includes(u)) found.push(u);
                }
            }
            return found;
        }

        // ============ استخراج MP4 من رابط Shadwo ============
        async function extractMp4(shadwoUrl) {
            const baseUrl = shadwoUrl.includes('serv=') ? shadwoUrl :
                           shadwoUrl + (shadwoUrl.includes('?') ? '&' : '?') + 'serv=0';
            const mp4plusUrl = baseUrl.replace(/serv=\d+/g, 'serv=2');
            const processedIframes = new Set();

            try {
                const servHtml = await fetchPage(mp4plusUrl);
                const iframes = extractIframes(servHtml);

                for (const iframeUrl of iframes) {
                    if (processedIframes.has(iframeUrl)) continue;
                    processedIframes.add(iframeUrl);

                    try {
                        const iframeHtml = await fetchPage(iframeUrl);
                        const aflmUrls = extractAflmUrls(iframeHtml);
                        
                        if (aflmUrls.length > 0) return aflmUrls[0];

                        // iframe متداخل
                        const nestedIframes = extractIframes(iframeHtml);
                        for (const nestedUrl of nestedIframes) {
                            if (processedIframes.has(nestedUrl)) continue;
                            processedIframes.add(nestedUrl);
                            try {
                                const nestedHtml = await fetchPage(nestedUrl);
                                const nestedAflm = extractAflmUrls(nestedHtml);
                                if (nestedAflm.length > 0) return nestedAflm[0];
                            } catch(e) {}
                        }
                    } catch(e) {}
                }
                return null;
            } catch(e) {
                return null;
            }
        }

        // ============ تحديث Firebase ============
        async function updateFirebase(seriesId, episodes) {
            try {
                const res = await fetch(`${FIREBASE_URL}/series/${seriesId}/episodes.json`, {
                    method: 'PUT',
                    body: JSON.stringify(episodes),
                    headers: { 'Content-Type': 'application/json' }
                });
                return res.ok;
            } catch(e) { return false; }
        }

        // ============ الدالة الرئيسية ============
        (async function main() {
            addLog('🚀 ========== بدء دورة جديدة ==========');

            let totalChecked = 0, totalConverted = 0, totalFailed = 0;

            try {
                const res = await fetch(`${FIREBASE_URL}/series.json`);
                const data = await res.json();

                for (const seriesId in data) {
                    const series = data[seriesId];
                    if (!series.episodes || !Array.isArray(series.episodes)) continue;

                    let changed = false;
                    const episodes = JSON.parse(JSON.stringify(series.episodes));

                    for (let i = 0; i < episodes.length; i++) {
                        const fields = ['link1', 'link2', 'link3'];

                        for (const field of fields) {
                            const link = episodes[i][field] || '';

                            // ===== فقط روابط shadwo.pro =====
                            if (!link.includes('shadwo.pro')) continue;

                            totalChecked++;
                            totalCheckedEl.textContent = totalChecked;
                            addLog(`🔍 [${series.title || seriesId}] ح${i+1} ${field}`);

                            const mp4 = await extractMp4(link);

                            if (mp4) {
                                episodes[i][field] = mp4;
                                changed = true;
                                totalConverted++;
                                totalConvertedEl.textContent = totalConverted;
                                addLog(`  ✅ ${mp4.substring(0, 70)}...`);
                            } else {
                                totalFailed++;
                                totalFailedEl.textContent = totalFailed;
                                addLog(`  ❌ فشل`);
                            }

                            await new Promise(r => setTimeout(r, 2000));
                        }
                    }

                    if (changed) {
                        const ok = await updateFirebase(seriesId, episodes);
                        addLog(`💾 ${ok ? '✅' : '❌'} حفظ: ${series.title || seriesId}`);
                    }
                }

                addLog('');
                addLog(`📊 فحص: ${totalChecked} | ✅ ${totalConverted} | ❌ ${totalFailed}`);
                addLog(`⏰ ${new Date().toLocaleString('ar-SA')}`);
                addLog('✅ ========== انتهت الدورة ==========');

            } catch(e) {
                addLog(`❌ خطأ: ${e.message}`);
            }
        })();
    </script>
</body>
</html>
