            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            margin-top:20px;
        }

        .btn:hover{
            transform:scale(1.05);
        }

        @keyframes blink{
            0%{opacity:1;}
            50%{opacity:.4;}
            100%{opacity:1;}
        }

        @keyframes load{
