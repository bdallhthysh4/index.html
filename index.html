<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محول Shadwo → MP4 - API</title>
</head>
<body>
    <pre id="result">جاري العمل...</pre>
    <script>
        const FIREBASE_URL = 'https://mo-play-b0cb7-default-rtdb.firebaseio.com';
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
        ];

        const log = (msg) => {
            document.getElementById('result').textContent += '\n' + msg;
        };

        async function fetchPage(url) {
            for (const proxy of PROXIES) {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 10000);
                    const res = await fetch(proxy + encodeURIComponent(url), {
                        signal: ctrl.signal,
                        headers: { 'User-Agent': 'Mozilla/5.0' }
                    });
                    clearTimeout(t);
                    if (res.ok) return await res.text();
                } catch(e) {}
            }
            return null;
        }

        async function extractMp4(shadwoUrl) {
            const mp4Url = shadwoUrl.replace(/serv=\d+/, 'serv=2');
            const html = await fetchPage(mp4Url);
            if (!html) return null;
            const iframeMatch = html.match(/<iframe[^>]+src=["']([^"']+)["']/i);
            if (!iframeMatch) return null;
            const iframeHtml = await fetchPage(iframeMatch[1]);
            if (!iframeHtml) return null;
            const aflmMatch = iframeHtml.match(/https?:\/\/aflm[^"'\s]*cdnz\.quest\/[a-z0-9]+\/v\.mp4/i);
            if (aflmMatch) return aflmMatch[0];
            const nestedMatch = iframeHtml.match(/<iframe[^>]+src=["']([^"']+)["']/i);
            if (nestedMatch) {
                const nestedHtml = await fetchPage(nestedMatch[1]);
                if (nestedHtml) {
                    const nestedAflm = nestedHtml.match(/https?:\/\/aflm[^"'\s]*cdnz\.quest\/[a-z0-9]+\/v\.mp4/i);
                    if (nestedAflm) return nestedAflm[0];
                }
            }
            return null;
        }

        (async function main() {
            log('🚀 بدء: ' + new Date().toLocaleString('ar-SA'));
            
            const res = await fetch(FIREBASE_URL + '/series.json');
            const data = await res.json();
            
            let checked = 0, converted = 0, failed = 0;
            
            for (const id in data) {
                if (!data[id].episodes) continue;
                let changed = false;
                const eps = JSON.parse(JSON.stringify(data[id].episodes));
                
                for (let i = 0; i < eps.length; i++) {
                    for (const f of ['link1', 'link2', 'link3']) {
                        const link = eps[i][f] || '';
                        if (!link.includes('shadwo.pro')) continue;
                        
                        checked++;
                        log('🔍 ' + link.substring(0, 50));
                        
                        const mp4 = await extractMp4(link);
                        if (mp4) {
                            eps[i][f] = mp4;
                            changed = true;
                            converted++;
                            log('✅ ' + mp4.substring(0, 50));
                        } else {
                            failed++;
                            log('❌ فشل');
                        }
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }
                
                if (changed) {
                    await fetch(FIREBASE_URL + '/series/' + id + '/episodes.json', {
                        method: 'PUT',
                        body: JSON.stringify(eps),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    log('💾 تم: ' + data[id].title);
                }
            }
            
            log('✅ فحص:' + checked + ' | تم:' + converted + ' | فشل:' + failed);
        })();
    </script>
</body>
</html>
