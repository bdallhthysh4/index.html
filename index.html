<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا - جاري التجهيز</title>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .ad-box { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            margin: 20px 0; 
            min-height: 250px; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
        }
        .timer { font-size: 20px; margin: 20px; color: #e74c3c; border: 1px solid #e74c3c; padding: 10px; border-radius: 5px; }
        .btn { 
            background: #e74c3c; color: white; border: none; padding: 15px; 
            width: 100%; font-size: 18px; border-radius: 5px; display: none; cursor: pointer; 
        }
        img { max-width: 100%; height: auto; }
        .ad-label { font-size: 10px; color: #555; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>حكايتنا - انتظر ثواني</h2>
    
    <div class="ad-box">
        <span class="ad-label">إعلان مروج</span>
        <a href="https://al5sm.com/tag.min.js?zone=10943622" target="_blank">
            <img src="https://placehold.co/300x250/222/white?text=اضغط+هنا+للمشاهدة" alt="Ad">
        </a>
    </div>

    <div id="timer" class="timer">جاري تجهيز السيرفر: <span id="sec">15</span> ثانية</div>
    <button id="btn" class="btn" onclick="location.href='https://www.hikaytna.my/'">انقر هنا للمشاهدة</button>

    <div class="ad-box">
        <span class="ad-label">إعلان مروج</span>
        <a href="https://al5sm.com/tag.min.js?zone=10943622" target="_blank">
            <img src="https://placehold.co/300x250/222/white?text=اعلان+احتياطي" alt="Ad">
        </a>
    </div>
</div>

<script>
    // 1. تشغيل العداد
    let s = 15;
    let timer = setInterval(() => {
        s--;
        document.getElementById('sec').innerText = s;
        if (s <= 0) {
            clearInterval(timer);
            document.getElementById('timer').style.display = 'none';
            document.getElementById('btn').style.display = 'block';
        }
    }, 1000);

    // 2. سكريبت الإعلان المنبثق (al5sm) يفتح مرة واحدة عند أول لمسة
    document.addEventListener('click', function fire() {
        var script = document.createElement('script');
        script.src = 'https://al5sm.com/tag.min.js';
        script.dataset.zone = '10943622';
        document.head.appendChild(script);
        document.removeEventListener('click', fire);
    }, {once: true});
</script>

</body>
</html>
